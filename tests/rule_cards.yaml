# 総合ルール準拠テスト（tests/test_rules.py）専用の架空カード。ID は R 始まり。
# 条文の状況を最小の盤面で作るためのもので、実カードではない。
cards:
  - id: R001
    name: 墓所の番人
    types: [creature]
    civs: [darkness]
    cost: 2
    power: 1000
    races: [テスト]
    text: クリーチャーが破壊された時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: {owner: any, filter: {types: [creature]}}}
        effect:
          - {op: draw, count: 1}

  - id: R002
    name: 全滅の儀
    types: [spell]
    civs: [darkness]
    cost: 1
    text: すべてのクリーチャーを破壊する。
    spell:
      - op: destroy
        select: {zone: bz, owner: any, filter: {types: [creature]}, count: all}

  - id: R003
    name: 身代わりの守り手
    types: [creature]
    civs: [nature]
    cost: 2
    power: 2000
    races: [テスト]
    text: 自分のクリーチャーが破壊される時、墓地に置くかわりに手札に戻してもよい。
    abilities:
      - kind: replace
        optional: true
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: {owner: you, filter: {types: [creature]}}}
        instead:
          - {op: bounce, select: {ref: event.subject}}

  - id: R004
    name: 奈落の看守
    types: [creature]
    civs: [darkness]
    cost: 3
    power: 3000
    races: [テスト]
    text: 相手のクリーチャーが破壊される時、墓地に置くかわりに山札の一番下に置く。
    abilities:
      - kind: replace
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: {owner: opp}}
        instead:
          - {op: move, select: {ref: event.subject}, to: deck, reason: put, position: bottom}

  - id: R006
    name: 観測の突撃兵
    types: [creature]
    civs: [fire]
    cost: 3
    power: 3000
    races: [テスト]
    text: スピードアタッカー / 相手のシールドがブレイクされた時、このクリーチャーがバトルゾーンにあれば、相手の山札の上から1枚目を墓地に置く。
    keywords: [speed_attacker]
    abilities:
      - kind: trigger
        when: {event: break, player: opp}
        if: {exists: {ref: self}}
        effect:
          - {op: mill, owner: opp, count: 1}

  - id: R007
    name: 打ち砕きの知恵
    types: [spell]
    civs: [fire]
    cost: 1
    text: 相手のシールドを1つブレイクする。その後、自分のクリーチャーがいれば、カードを2枚引く。
    spell:
      - {op: break, player: opp, count: 1}
      - op: if
        cond: {exists: {zone: bz, owner: you, filter: {types: [creature]}}}
        then:
          - {op: draw, count: 2}

  - id: R008
    name: 反撃の砲火
    types: [spell]
    civs: [fire]
    cost: 3
    text: S・トリガー / 相手のシールドを1つブレイクする。
    keywords: [s_trigger]
    spell:
      - {op: break, player: opp, count: 1}

  - id: R009
    name: 備えの知恵
    types: [spell]
    civs: [water]
    cost: 2
    text: S・トリガー / カードを1枚引く。
    keywords: [s_trigger]
    spell:
      - {op: draw, count: 1}

  - id: R010
    name: 伏兵の精
    types: [creature]
    civs: [nature]
    cost: 3
    power: 2000
    races: [テスト]
    text: S・トリガー / このクリーチャーがバトルゾーンに出た時、カードを1枚引いてもよい。
    keywords: [s_trigger]
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: may
            body:
              - {op: draw, count: 1}

  - id: R011
    name: 寄生の芽
    types: [creature]
    civs: [nature]
    cost: 1
    power: 1000
    races: [テスト]
    text: このクリーチャーがバトルゾーンに出た時、自分の山札の上から1枚目をこのクリーチャーの下に置く。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: put_under, select: {zone: deck, owner: you, from_top: 1}, onto: {ref: self}}

  - id: R012
    name: 枯らしの霧
    types: [spell]
    civs: [water]
    cost: 1
    text: 各プレイヤーは自分の山札の上から1枚目を墓地に置く。
    spell:
      - {op: move, select: {zone: deck, owner: any, from_top: 1}, to: graveyard, reason: put}

  - id: R013
    name: 衰弱の呪い
    types: [spell]
    civs: [darkness]
    cost: 1
    text: このターン、相手のクリーチャーを1体選び、パワーを-3000する。その後、相手のクリーチャーがいなければ、カードを1枚引く。
    spell:
      - {op: modify, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, mod: {power: -3000}}
      - op: if
        cond: {not: {exists: {zone: bz, owner: opp, filter: {types: [creature]}}}}
        then:
          - {op: draw, count: 1}

  - id: R014
    name: 弱体の刺客
    types: [creature]
    civs: [darkness]
    cost: 1
    power: 1000
    races: [テスト]
    text: このクリーチャーがバトルゾーンに出た時、このターン、相手のクリーチャーを1体選び、パワーを-3000する。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: modify, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, mod: {power: -3000}}

  - id: R015
    name: 盗み見の使い魔
    types: [creature]
    civs: [water]
    cost: 2
    power: 1000
    races: [テスト]
    text: 相手がカードを引いた時、相手の山札の上から1枚目を墓地に置いてもよい。
    abilities:
      - kind: trigger
        when: {event: draw, player: opp}
        effect:
          - op: may
            body:
              - {op: mill, owner: opp, count: 1}

  - id: R016
    name: 落日の兵
    types: [creature]
    civs: [darkness]
    cost: 2
    power: 2000
    races: [テスト]
    text: 自分のターン中にこのクリーチャーが破壊された時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        if: {is_turn: you}
        effect:
          - {op: draw, count: 1}

  - id: R017
    name: 三刃二刃の竜
    types: [creature]
    civs: [fire]
    cost: 5
    power: 5000
    races: [テスト]
    text: W・ブレイカー / T・ブレイカー
    keywords: [double_breaker, triple_breaker]

  - id: R018
    name: 試験用ジョーカーズ
    types: [creature]
    civs: [zero]
    cost: 1
    power: 1000
    races: [ジョーカーズ]
    text: (バトルの身代わり試験用)

  - id: R019
    name: 試験用進化V
    types: [creature, evolution]
    civs: [nature]
    cost: 2
    power: 6000
    races: [テスト]
    text: (進化元を1体以上バトルゾーンから選ぶ試験用)
    evolve_from: {types: [creature]}
    evolve_any: true

  - id: R020
    name: 試験用シールド回収
    types: [spell]
    civs: [nature]
    cost: 1
    text: 自分のシールドを1つ手札に加える。
    spell:
      - op: move
        select: {zone: shield, owner: you, count: 1}
        to: hand
        reason: return

  - id: R021
    name: 試験用盾の束
    types: [spell]
    civs: [nature]
    cost: 1
    text: 自分の山札の上から3枚を、自分のシールドを1つ選び、その下に置く。
    spell:
      - op: put_under
        select: {zone: deck, owner: you, from_top: 3}
        onto: {zone: shield, owner: you, count: 1}

  - id: R022
    name: 試験用先処理ブレイク
    types: [spell]
    civs: [nature]
    cost: 1
    text: 自分のシールドを1つブレイクする。S・トリガーはすぐに解決する。その後、カードを1枚引く。
    spell:
      - {op: break, player: you, count: 1, st_first: true}
      - {op: draw, count: 1}

  # 起動型能力（602）: 攻撃する代わりにタップして使う
  - id: R050
    name: 試験用タップ能力
    types: [creature]
    civs: [water]
    cost: 2
    power: 1000
    races: [テスト]
    text: このクリーチャーで攻撃する代わりに、タップして次の能力を使ってもよい。カードを1枚引く。
    abilities:
      - kind: activate
        cost: {tap: self}
        effect:
          - {op: draw, count: 1}

  - id: R051
    name: 試験用光タップ能力
    types: [creature]
    civs: [light]
    cost: 2
    power: 1000
    races: [テスト]
    text: バトルゾーンにある自分の光のクリーチャーをタップし、攻撃する代わりに次の能力を使ってもよい。カードを1枚引く。
    abilities:
      - kind: activate
        cost: {tap: {civs: [light]}}
        effect:
          - {op: draw, count: 1}

  - id: R052
    name: 試験用攻撃不能タップ能力
    types: [creature]
    civs: [water]
    cost: 2
    power: 1000
    races: [テスト]
    text: このクリーチャーは攻撃できない。攻撃する代わりに、タップしてカードを1枚引いてもよい。
    abilities:
      - kind: static
        affects: self
        mod: {deny: [attack_player, attack_creature]}
      - kind: activate
        cost: {tap: self}
        effect:
          - {op: draw, count: 1}

  # クロスギア（303）: クロスしたクリーチャーに及ぶ常在型・誘発型
  - id: R053
    name: 試験用クロスギア
    types: [cross_gear]
    civs: [nature]
    cost: 2
    text: これをクロスしたクリーチャーのパワーは+1500され、ブロッカーを得る。これをクロスしたクリーチャーが破壊された時、カードを1枚引く。
    abilities:
      - kind: static
        affects: crossed
        mod: {power: 1500, grant: [blocker]}
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: crossed}
        effect:
          - {op: draw, count: 1}

  # ウェーブストライカー: 他に2体以上いる間だけ能力を得る（条件は誘発時と解決時に見る。603.4）
  - id: R054
    name: 試験用ウェーブストライカー
    types: [creature]
    civs: [nature]
    cost: 1
    power: 1000
    races: [テスト]
    keywords: [wave_striker]
    text: ウェーブストライカー / このクリーチャーが出た時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        if: {cmp: [{count: {zone: bz, owner: any, other: true, filter: {keyword: wave_striker}}}, ">=", 2]}
        effect:
          - {op: draw, count: 1}

  - id: R055
    name: 試験用ウェーブ強化
    types: [creature]
    civs: [light]
    cost: 1
    power: 1000
    races: [テスト]
    keywords: [wave_striker]
    text: ウェーブストライカー / このクリーチャーのパワーは+4000され、バトルゾーンにある自分のクリーチャーすべてのパワーは+1000される。
    abilities:
      - kind: static
        affects: self
        if: {cmp: [{count: {zone: bz, owner: any, other: true, filter: {keyword: wave_striker}}}, ">=", 2]}
        mod: {power: 4000}
      - kind: static
        affects: {zone: bz, owner: you, filter: {types: [creature]}}
        if: {cmp: [{count: {zone: bz, owner: any, other: true, filter: {keyword: wave_striker}}}, ">=", 2]}
        mod: {power: 1000}

  # 強制（506.1b 攻撃しなければならない, 507.1b ブロックしなければならない）
  - id: R056
    name: 試験用強制攻撃
    types: [creature]
    civs: [fire]
    cost: 1
    power: 1000
    races: [テスト]
    text: このクリーチャーは、毎ターン攻撃しなければならない。
    abilities:
      - {kind: static, affects: self, mod: {require: [attack]}}

  - id: R057
    name: 試験用強制ブロック
    types: [creature]
    civs: [light]
    cost: 1
    power: 5000
    races: [テスト]
    keywords: [blocker]
    text: ブロッカー / 相手のクリーチャーが攻撃する時、このクリーチャーは可能であればブロックする。
    abilities:
      - {kind: static, affects: self, mod: {require: [block]}}

  # サイレントスキル（501.1a）
  - id: R058
    name: 試験用サイレントスキル
    types: [creature]
    civs: [darkness]
    cost: 1
    power: 1000
    races: [テスト]
    keywords: [silent_skill]
    text: サイレントスキル / カードを1枚引く。
    abilities:
      - kind: silent
        effect:
          - {op: draw, count: 1}

  # ターボラッシュ: 自分の他のクリーチャーがシールドをブレイクしたあと、そのターンの間だけ能力を得る
  - id: R059
    name: 試験用ターボラッシュ
    types: [creature]
    civs: [water]
    cost: 1
    power: 1000
    races: [テスト]
    keywords: [turbo_rush]
    text: ターボラッシュ / このクリーチャーが攻撃するとき、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        if: {self_marked: turbo_rush}
        effect:
          - {op: draw, count: 1}

  # 攻撃された時・ブロックされた時の誘発（攻撃先 target・攻撃クリーチャー attacker の条件）
  - id: R060
    name: 試験用攻撃を受ける者
    types: [creature]
    civs: [light]
    cost: 1
    power: 5000
    races: [テスト]
    text: このクリーチャーが攻撃された時、カードを1枚引く。自分のクリーチャーが攻撃された時、そのクリーチャーのパワーを+1000する。
    abilities:
      - kind: trigger
        when: {event: attack, target: self}
        effect:
          - {op: draw, count: 1}
      - kind: trigger
        when: {event: attack, target: {owner: you, other: true}}
        effect:
          - {op: modify, select: {ref: event.target}, mod: {power: 1000}, duration: permanent}

  - id: R061
    name: 試験用ブロックされる者
    types: [creature]
    civs: [fire]
    cost: 1
    power: 1000
    races: [テスト]
    text: このクリーチャーがブロックされた時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: block, attacker: self}
        effect:
          - {op: draw, count: 1}

  # サイクロン（唱える直前に召喚していれば、唱えた後に手札へ戻す）
  - id: R062
    name: 試験用サイクロン呪文
    types: [spell]
    civs: [light]
    cost: 1
    keywords: [cyclone]
    text: サイクロン。カードを1枚引く。
    spell:
      - {op: draw, count: 1}

  - id: R063
    name: 試験用呪文付与者
    types: [creature]
    civs: [light]
    cost: 1
    power: 1000
    races: [テスト]
    text: 自分が唱える呪文はすべて「サイクロン」を得る。
    abilities:
      - kind: static
        affects: {zone: hand, owner: you, filter: {types: [spell]}}
        mod: {grant: [cyclone]}

  - id: R064
    name: 試験用通常呪文
    types: [spell]
    civs: [light]
    cost: 1
    text: カードを1枚引く。
    spell:
      - {op: draw, count: 1}

  # S・バック（シールドから手札に加わる光のカードを捨てて、無料で実行する）
  - id: R065
    name: 試験用S・バック獣
    types: [creature]
    civs: [light]
    cost: 5
    power: 3000
    races: [テスト]
    keywords: [s_back_light]
    text: S・バック-光

  - id: R066
    name: 試験用S・バック呪文
    types: [spell]
    civs: [water]
    cost: 5
    keywords: [s_back_light]
    text: S・バック-光。カードを2枚引く。
    spell:
      - {op: draw, count: 2}

  # 進化GV（進化元をちょうど3体重ねる）とメテオバーン（下のカードを墓地に置いてもよい。そうした場合だけ効果）
  - id: R067
    name: 試験用GV進化獣
    types: [creature, evolution]
    civs: [nature]
    cost: 1
    power: 9000
    races: [テスト]
    evolve_from: {races: [テスト]}
    evolve_count: 3
    text: 進化GV。メテオバーン - このクリーチャーが攻撃する時、下にあるカードを１枚墓地に置いてもよい。そうした場合、パワー4000以下のクリーチャーをすべて破壊する。
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        effect:
          - op: may
            body:
              - {op: move, select: {under_of: self, count: 1}, to: graveyard, reason: put, as: paid}
              - op: if
                cond: {exists: {ref: paid}}
                then:
                  - {op: destroy, select: {zone: bz, owner: any, filter: {types: [creature], power_le: 4000}, count: all}}

  # ダイナモ（攻撃できる時・バトルが始まる時にタップして、パワーと能力を自分の他のダイナモ1体に加える）
  - id: R068
    name: 試験用ダイナモ壁
    types: [creature]
    civs: [nature]
    cost: 1
    power: 3000
    races: [テスト]
    keywords: [dynamo, blocker]
    text: ブロッカー / ダイナモ

  - id: R069
    name: 試験用ダイナモ戦士
    types: [creature]
    civs: [nature]
    cost: 1
    power: 2000
    races: [テスト]
    keywords: [dynamo]
    text: ダイナモ

  - id: R070
    name: 試験用4000
    types: [creature]
    civs: [nature]
    cost: 1
    power: 4000
    races: [テスト]
    text: 試験用の相手クリーチャー

  - id: R071
    name: 試験用S・バック種族獣
    types: [creature]
    civs: [light]
    cost: 5
    power: 3000
    races: [ドラゴン]
    s_back: {races: [テスト]}
    text: S・バック―テスト

  - id: R072
    name: 試験用S・バック複合文明呪文
    types: [spell]
    civs: [water]
    cost: 5
    s_back: {civs: [water, darkness]}
    text: S・バック：水または闇。カードを2枚引く。
    spell:
      - {op: draw, count: 2}

  - id: R073
    name: 試験用メテオバーン起動獣
    types: [creature, evolution]
    civs: [nature]
    cost: 1
    power: 9000
    races: [テスト]
    evolve_from: {races: [テスト]}
    text: 進化。メテオバーン - このクリーチャーが攻撃できる時、このクリーチャーの下にあるカードを1枚墓地に置いてもよい。そうした場合、相手のクリーチャーを1体タップしてもよい。
    abilities:
      - kind: activate
        cost: {under: 1}
        effect:
          - op: may
            body:
              - {op: tap, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}}

  - id: R074
    name: 試験用汎用メテオバーン起動獣
    types: [creature, evolution]
    civs: [nature]
    cost: 1
    power: 9000
    races: [テスト]
    evolve_from: {races: [テスト]}
    text: 進化。メテオバーン - 自分のクリーチャーが攻撃できる時、このクリーチャーの下にあるカードを1枚墓地に置いてもよい。そうした場合、カードを1枚引く。
    abilities:
      - kind: activate
        any_attacker: true
        cost: {under: 1}
        effect:
          - {op: draw, count: 1}

  - id: R075
    name: 試験用バトル跳ね返し獣
    types: [creature]
    civs: [water]
    cost: 1
    power: 3000
    races: [テスト]
    text: このクリーチャーがバトルする時、バトルしている相手のクリーチャーを持ち主の手札に戻してもよい。
    abilities:
      - kind: trigger
        when: {event: battle_start, subject: self}
        effect:
          - op: may
            body:
              - {op: bounce, select: {ref: event.opponent}}
      - kind: trigger
        when: {event: battle_start, opponent: self}
        effect:
          - op: may
            body:
              - {op: bounce, select: {ref: event.subject}}

  - id: R076
    name: 試験用2000
    types: [creature]
    civs: [nature]
    cost: 1
    power: 2000
    races: [テスト]
    text: 試験用の相手クリーチャー

  - id: R077
    name: 試験用攻撃され獣
    types: [creature]
    civs: [water]
