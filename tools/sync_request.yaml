# このファイルを push すると .github/workflows/sync-cards.yml が動く。
# task: list（商品の一覧だけ） / catalog（各商品のカードID一覧を台帳へ） / fetch（カード詳細を取得）
# products: all か、商品の値のカンマ区切り（例: 26ex4,22rp1）。max_minutes: この時間で打ち切る（再実行で続きから）
# all は台帳の並び（新しい弾が先）で、未取得の商品を順に取る。
# 様子見: 最初の数百枚だけ取って、詳細ページの型（空・項目欠け・名前表記）を調べる。
task: fetch
products: all
max_minutes: 20
