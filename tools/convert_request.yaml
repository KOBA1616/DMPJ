# push すると .github/workflows/convert-cards.yml が動く（OpenCode の無料モデルで効果変換）。
# 取得済みの原文（cards-data ブランチの data/cards/raw）のうち未変換のカードを、limit 枚まで変換して cards-data に保存する。
task: eval           # convert | eval（手作業の実カードとの一致率を測る）
model: glm-5.3-flash-free   # 許可リスト（tools/convert_cards.py の OPENCODE_FREE_MODELS）外は拒否される
limit: 10            # 1回あたりの上限枚数
interval: 6          # リクエスト間隔（秒）
