# 定期自動変換（.github/workflows/auto-convert.yml）の設定。変更を main に入れると反映される。
# 止めたい時: enabled を false にして main に入れる（または Actions → auto-convert → ... → Disable workflow）。
enabled: false              # 2026-10-26 Actions の匿名無料枠は応答しない/キーは401。変換は koba の PC のローカルワーカーで回す（docs/offload.md）。戻す時は true
model: deepseek-v4.1-flash-free  # 2026-10-25 glm-5.3-flash-free が150秒超で応答しない状態が続いたため切替（公式で Free・ゼロ保持）。戻すなら glm-5.3-flash-free
#model: glm-5.3-flash-free # 許可リスト（tools/convert_cards.py の OPENCODE_FREE_MODELS）外は拒否される
limit: 10                   # 1回あたりの上限枚数（新規・再試行それぞれ）
batch: 5                    # 1単位の枚数。API失敗だけの単位は飛ばして次の5枚へ（2単位続けて失敗で打ち切り）
interval: 1                 # リクエスト間隔（秒、全ワーカー合計）
workers: 1                  # 並列数。2にすると opencode CLI の並列起動で本文が返らない失敗が出た(2026-10-24)
timeout: 300                # 1枚の呼び出しの上限秒。超えたら reason: timeout で対象外（rejects）にして次へ
use_key: true             # 試験運用: Secret OPENCODE_API_KEY を opencode CLI に渡す。false で匿名に戻す（許可リストの -free モデルだけ使い、課金系の応答があれば停止）
