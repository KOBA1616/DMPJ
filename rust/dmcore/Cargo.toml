[package]
name = "dmcore"
version = "0.0.1"
edition = "2021"
description = "DMSIM のエンジンコア（Rust 試作）。Python 版と同一シードで状態の digest・選択肢順が一致することを回帰基準にする"

[lib]
name = "dmcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
