[project]
name = "dmsim"
version = "0.0.1"
description = "Duel Masters rules engine prototype (DMPJ)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
convert = ["anthropic>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --durations=10 -m \"not slow\""
markers = [
  "slow: 実シミュレーション等の長時間テスト。通常の全体テストでは除外し、全部走らせる時は -m \"slow or not slow\" を付ける",
]
