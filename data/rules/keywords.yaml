# キーワード能力の定義（設計判断④⑥）
# どのキーワードも「能力の並び」に展開される。ルール側（攻撃・ブロック・ブレイク処理など）は
# キーワード名を見ず、常在型能力が与える許可・禁止（permissions.yaml）と数値（breaks など）だけを見る。
# 新しいキーワードはここに足す。エンジンのコードは変えない。
#
# static の mod で使えるもの:
#   power: N            パワー修整
#   grant: [kw...]      キーワードを与える（与えたキーワードの常在型能力も働く）
#   allow: [act...]     行為を許可する（permissions.yaml）。要素は名前か {action, other: filter}
#   deny:  [act...]     行為を禁止する。「できない」は「できる」に勝つ（101.2）
#   breaks: N           ブレイクするシールドの数（大きい方を使う）
#   ignore: [ability kinds]  能力を無視する（608.4, 608.5）
# zone: 能力が機能するゾーン（既定 bz）。S・トリガーはシールドゾーンで機能する。
keywords:
  blocker:
    ja: ブロッカー
    abilities:
      - {kind: static, affects: self, mod: {allow: [block]}}
  kizuna:
    ja: キズナ（このクリーチャーが出た時、自分のクリーチャー1体の[P]能力を使う）
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: use_partner}
  # キズナプラス（第153弾）: 支払い（下のカード1枚を墓地に置く）を行ったら、2つの[P]は
  # その時点でそれぞれ確定した待機効果になる（603.3a）。use_partner に pending: true を付けると
  # その場では解決せず待機に登録され、解決順は使う側が好きな順番で選べる（605.1）。
  # 他の[P]持ちがいなくても支払いだけ行って自分の[P]だけ使える（101.3／605.2b）ので、
  # 誘発の if は「下のカード1枚以上」だけにする（exclude_self 側は候補なしで何もしない）。
  kizuna_plus:
    ja: キズナプラス（このクリーチャーが攻撃する時、その下にあるカードを1枚、自分の墓地に置いてもよい。そうしたら、このクリーチャーと自分の他のクリーチャー1体の[P]能力を使う）
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        if: {cmp: [{count: {under_of: self}}, ">=", 1]}
        effect:
          - op: may
            body:
              - {op: move, select: {under_of: self, count: 1}, to: graveyard, reason: put}
              - {op: use_partner, of: self, pending: true}
              - {op: use_partner, exclude_self: true, pending: true}
  abyss_rush:
    ja: アビスラッシュ
    abilities:
      - {kind: static, zone: graveyard, affects: self, mod: {allow: [summon_from_graveyard]}}
  # G・リンク: キーワード自体は「どの位置のゴッドか」の印。リンク手順・特性統合・離脱置換はエンジン側（docs/g-link-plan.md）
  left_g_link:
    ja: 左G・リンク
    abilities: []
  center_g_link:
    ja: 中央G・リンク
    abilities: []
  right_g_link:
    ja: 右G・リンク
    abilities: []
  speed_attacker:
    ja: スピードアタッカー
    abilities:
      - {kind: static, affects: self, mod: {allow: [attack_summoning_sick]}}
  s_trigger:
    ja: S・トリガー
    abilities:
      - {kind: static, zone: shield, affects: self, mod: {allow: [s_trigger]}}
  super_s_trigger:
    ja: スーパー・S・トリガー（このカードをシールドゾーンから手札に加える時、コストを支払わずにすぐ使ってもよい。その時自分のシールドが1つもなければ、このカードに記された追加能力を得る）
    abilities:
      - {kind: static, zone: shield, affects: self, mod: {allow: [s_trigger]}}
  s_trigger_plus:
    ja: S・トリガー・プラス（このカードをシールドゾーンから手札に加える時、コストを支払わずにすぐ使ってもよい。それが相手のターンで、そのターン中に自分のシールドが2つ以上ブレイクされていれば、このカードに記された追加能力を得る）
    abilities:
      - {kind: static, zone: shield, affects: self, mod: {allow: [s_trigger]}}
  shield_go:
    ja: シールド・ゴー（このクリーチャーが破壊された時、表向きにシールド化する。このクリーチャーが表向きで、シールドゾーンを離れる時、かわりに自分の墓地に置く）
    abilities:
      - kind: replace
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        instead:
          - {op: move, select: {ref: self}, to: shield, reason: put, face_up: true}
      - kind: replace
        zone: shield
        when: {event: move, from: shield, subject: self}
        if: {face_up: true}
        instead:
          - {op: move, select: {ref: self}, to: graveyard, reason: put}
  null_breaker:
    ja: ヌル・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 0}}
  double_breaker:
    ja: W・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 2}}
  triple_breaker:
    ja: T・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 3}}
  cannot_attack_player:
    ja: このクリーチャーは相手プレイヤーを攻撃できない
    abilities:
      - {kind: static, affects: self, mod: {deny: [attack_player]}}
  cannot_attack:
    ja: このクリーチャーは攻撃できない
    aliases: [このクリーチャーは攻撃することができない]
    abilities:
      - {kind: static, affects: self, mod: {deny: [attack_player, attack_creature]}}
  unblockable:
    ja: このクリーチャーはブロックされない
    abilities:
      - {kind: static, affects: self, mod: {deny: [be_blocked]}}
  # 例: 誘発型を含むもの。「バトルゾーンに出た時、自分の山札の上から1枚目をマナゾーンに置く」
  mana_boost_cip:
    ja: (テスト用) 出た時マナ加速
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: move, select: {zone: deck, owner: you, from_top: 1}, to: mana, reason: put}
  slayer:
    ja: スレイヤー（このクリーチャーがバトルで負けた時、相手のクリーチャーも破壊する）
    abilities:
      - {kind: static, affects: self, mod: {allow: [slayer]}}
  # card: カード自体の性質を変えるキーワード（呪文の解決後の置き場所など）
  charger:
    ja: チャージャー（この呪文を唱えた後、墓地に置くかわりに自分のマナゾーンに置く）
    abilities: []
    card: {resolve_to: mana}
  spell_to_hand:      # 試験用: この呪文を唱えた後、墓地に置くかわりに手札に戻す（回収型呪文のループ検証）
    ja: この呪文を唱えた後、墓地に置くかわりに手札に戻す
    abilities: []
    card: {resolve_to: hand}
  cyclone:      # このターン、唱える直前にクリーチャーを召喚していれば、唱えた後に墓地ではなく手札に戻す（エンジンが直前の実行を見て判定）
    ja: サイクロン（このターン、この呪文を唱える直前にクリーチャーを召喚していれば、この呪文を唱えた後、墓地に置くかわりに自分の手札に戻す）
    abilities: []
  s_back_light:
    ja: S・バック-光（光のカードを自分のシールドゾーンから手札に加える時、そのカードを捨ててもよい。そうした場合、コストを支払わずにこのカードを実行する）
    abilities: []
    card: {s_back: light}
  s_back_water:
    ja: S・バック-水（水のカードを自分のシールドゾーンから手札に加える時、そのカードを捨ててもよい。そうした場合、コストを支払わずにこのカードを実行する）
    abilities: []
    card: {s_back: water}
  s_back_darkness:
    ja: S・バック-闇（闇のカードを自分のシールドゾーンから手札に加える時、そのカードを捨ててもよい。そうした場合、コストを支払わずにこのカードを実行する）
    abilities: []
    card: {s_back: darkness}
  s_back_fire:
    ja: S・バック-火（火のカードを自分のシールドゾーンから手札に加える時、そのカードを捨ててもよい。そうした場合、コストを支払わずにこのカードを実行する）
    abilities: []
    card: {s_back: fire}
  s_back_nature:
    ja: S・バック-自然（自然のカードを自分のシールドゾーンから手札に加える時、そのカードを捨ててもよい。そうした場合、コストを支払わずにこのカードを実行する）
    abilities: []
    card: {s_back: nature}
  dynamo:      # バトルが始まる時、あるいはこのクリーチャーで攻撃できる時、タップしてもよい。そうした場合、そのターンの終わりまで、パワーと能力（ダイナモ自身を除く）を自分の他のダイナモ1体に加える
    ja: ダイナモ（バトルが始まる時、あるいはこのクリーチャーで攻撃できる時、このクリーチャーをタップしてもよい。そうした場合、そのターンの終わりまで、このクリーチャーのパワーと能力をバトルゾーンにある自分の他のダイナモ１体に加える）
    abilities:
      - kind: activate
        cost: {tap: self}
        if: {exists: {zone: bz, owner: you, other: true, filter: {keyword: dynamo}}}
        effect: [{op: choose, select: {zone: bz, owner: you, other: true, filter: {keyword: dynamo}, count: 1}, as: dynamo_to},
           {op: modify, select: {ref: dynamo_to}, mod: {add_of: self}, duration: end_of_turn}]
      - kind: trigger
        when: {event: battle_start}
        if:
          all:
            - {exists: {ref: self, filter: {tapped: false}}}
            - {exists: {zone: bz, owner: you, other: true, filter: {keyword: dynamo}}}
        effect:
          - op: may
            body:
              - {op: tap, select: {ref: self}}
              - {op: choose, select: {zone: bz, owner: you, other: true, filter: {keyword: dynamo}, count: 1}, as: dynamo_to}
              - {op: modify, select: {ref: dynamo_to}, mod: {add_of: self}, duration: end_of_turn}
  evo_charger:
    ja: Evoチャージャー（チャージャーの後、マナのクリーチャー1体を自分の進化クリーチャーの下に重ねてもよい）
    abilities: []
    card:
      resolve_to: mana
      after_resolve:
        - op: may
          body:
            - op: put_under
              select: {zone: mana, owner: you, filter: {types: [creature]}, count: 1}
              onto: {zone: bz, owner: you, filter: {types: [evolution]}, count: 1}

  # EXライフ: 出す時に山札の上1枚をシールド化して紐付け、離れる時はかわりにそのシールドを墓地に置く。
  # シールド化は engine/events.py の _exlife_shield（出す時の状態定義。出た時の能力より先）。
  # 公式総合ルール Ver.1.53 には定義がない（701.33b の例で名前が出るだけ）。公式カード・裁定による。
  ex_life:
    ja: EXライフ
    abilities:
      - kind: replace
        when: {event: move, from: bz, subject: self}
        if: {exists: {exlife_of: self}}
        instead:
          - {op: move, select: {exlife_of: self, count: 1}, to: graveyard, reason: put}

  # ---- ルールだけで変換できるキーワード（tools/rule_convert.py が原文と照合する。モデルは呼ばない）----
  quad_breaker:
    ja: Q・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 4}}
  world_breaker:
    ja: ワールド・ブレイカー（相手のシールドをすべてブレイクする。breaks は大きい方を使うので十分大きい値で表す）
    abilities:
      - {kind: static, affects: self, mod: {breaks: 99}}
  cannot_block:
    ja: このクリーチャーはブロックできない
    abilities:
      - {kind: static, affects: self, mod: {deny: [block]}}
  cannot_untap:
    ja: このクリーチャーはアンタップしない
    abilities:
      - {kind: static, affects: self, mod: {deny: [untap_at_start]}}
  cannot_be_attacked:
    ja: このクリーチャーは攻撃されない
    abilities:
      - {kind: static, affects: self, mod: {deny: [be_attacked]}}
  enters_tapped:      # 適用は events の move 処理（EXライフと同じくキーワード名を見て処理する）
    ja: このクリーチャーは、タップしてバトルゾーンに出る
    abilities: []

  # ---- 名前つき効果（注釈つき）。原文の名前と注釈つき文言を rule_convert が照合する ----
  powered_breaker:    # 509.2: パワー6000ごとに1つ多くブレイクする（ブレイカー能力の1つ）
    ja: パワード・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks_per_power: 6000}}
  guardman:           # 507.1a/507.2b: 攻撃先をこのクリーチャーに変更できる（ブロッククリーチャーにはならない）
    ja: ガードマン
    abilities:
      - {kind: static, affects: self, mod: {allow: [guardman]}}
  g_strike:           # 509.5e: シールドゾーンから手札に加える時、相手のクリーチャー1体を選んでもよい。このターン攻撃できない
    ja: G・ストライク
    abilities:
      - kind: trigger
        zone: hand
        when: {event: move, from: shield, to: hand, subject: self}
        effect:
          - op: may
            body:
              - {op: choose, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, as: gs_target}
              - {op: modify, select: {ref: gs_target}, mod: {deny: [attack_player, attack_creature]}, duration: end_of_turn}
  shield_saver:       # 自分のシールドがブレイクされる時、かわりにこのクリーチャーを破壊してもよい
    ja: シールド・セイバー
    abilities:
      - kind: replace
        optional: true
        when: {event: move, from: shield, reason: break, subject: {owner: you}}
        instead:
          - {op: move, select: {ref: self}, to: graveyard, reason: destroy}
  escape:             # このクリーチャーが破壊される時、墓地に置くかわりに自分のシールドを1つ手札に加えてもよい（S・トリガーは使えない）
    ja: エスケープ
    abilities:
      - kind: replace
        optional: true
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        if: {exists: {zone: shield, owner: you}}
        instead:
          - {op: move, select: {zone: shield, owner: you, count: 1}, to: hand, reason: return, strigger: "off"}
  eternal_omega:      # このクリーチャーがバトルゾーンを離れる時、かわりに手札に戻す（強制の置換）
    ja: エターナル・Ω
    abilities:
      - kind: replace
        when: {event: move, from: bz, subject: self}
        instead:
          - {op: move, select: {ref: self}, to: hand, reason: return}
  last_burst:         # このクリーチャーが破壊された時、このカードの呪文側をコストを支払わずに唱えてもよい
    ja: ラスト・バースト
    abilities:
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        effect: &last_burst
          - op: may
            body: [{op: play_free, select: {ref: self_moved}, face: spell}]
  mega_last_burst:    # このクリーチャーが離れて、手札、マナゾーン、または墓地に置かれた時（山札・シールドは含まない）
    ja: メガ・ラスト・バースト
    abilities:
      - {kind: trigger, when: {event: move, from: bz, to: graveyard, subject: self}, effect: *last_burst}
      - {kind: trigger, when: {event: move, from: bz, to: hand, subject: self}, effect: *last_burst}
      - {kind: trigger, when: {event: move, from: bz, to: mana, subject: self}, effect: *last_burst}
  hunting:            # バトル中、このクリーチャーのパワーは、バトルゾーンにある自分のハンター1体につき+1000される
    ja: ハンティング
    abilities:
      - {kind: static, affects: self, mod: {battle_power: {amount: 1000, count: {zone: bz, owner: you, filter: {race_has: ハンター}}}}}
  shinka_rise:        # シンカライズ: このタマシードがクリーチャーであるかのように、この上に進化クリーチャーを置いてもよい
    ja: シンカライズ
    abilities:
      - {kind: static, affects: self, mod: {allow: [evolve_base]}}
  hyper_energy:       # ハイパーエナジー: 実行時、コストが異なる自分のクリーチャーを好きな数タップしてもよい。1体につきコストを2少なくする
    ja: ハイパーエナジー
    card: {tap_reduce: 2}
    abilities: []
  # ウェーブストライカー: 「バトルゾーンに「ウェーブストライカー」を持つクリーチャーが他に２体以上あれば、次の能力を得る」。
  # キーワード自体は印だけ。続く能力に if: {cmp: [{count: {zone: bz, owner: any, other: true, filter: {keyword: wave_striker}}}, ">=", 2]} を付けて書く
  wave_striker:
    ja: ウェーブストライカー
    abilities: []
  # サイレントスキル（501.1a）: 能力そのものは各カードの kind: silent。キーワードは「サイレントスキルを持つ」の印
  silent_skill:
    ja: サイレントスキル
    abilities: []
  # ターボラッシュ: 自分の他のクリーチャーがシールドをブレイクしたあと、そのターンが終わるまで次の能力を得る。
  # 印を付けるだけ。続く能力に if: {self_marked: turbo_rush} を付けて書く
  turbo_rush:
    ja: ターボラッシュ
    abilities:
      - kind: trigger
        when: {event: break, subject: {owner: you, other: true, filter: {types: [creature]}}}
        effect:
          - {op: mark, name: turbo_rush, of_self: true}
  freeze:      # 「ブロックされなかった」ことは、シールドがブレイクされたこと（break イベントの発生源がこのクリーチャー）で判定する
    ja: フリーズ（このクリーチャーが相手プレイヤーを攻撃してブロックされなかった時、バトルゾーンにある相手のクリーチャーを１体選び、タップしてもよい。そのクリーチャーは、次の相手のターンのはじめにアンタップしない）
    abilities:
      - kind: trigger
        when: {event: break, subject: self}
        effect:
          - op: may
            body:
              - {op: choose, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, as: frozen}
              - {op: tap, select: {ref: frozen}, no_untap_next: true}
  meteor_burn:
    ja: メテオバーン（このクリーチャーがバトルゾーンを離れる時、かわりにこのクリーチャーの下にあるカードを1枚選び墓地に置いてもよい。そうした場合、このクリーチャーはバトルゾーンに留まる）
    abilities:
      - kind: replace
        optional: true
        when: {event: move, from: bz, subject: self}
        if: {cmp: [{count: {under_of: self}}, ">=", 1]}
        instead:
          - {op: move, select: {under_of: self, count: 1}, to: graveyard, reason: put}
  g_neo:              # G-NEO進化の離脱置換: 離れる時、かわりに下のカードすべてが同じ行き先へ離れる（重ねる側は面の neo: true で宣言する）
    ja: G-NEO進化（このクリーチャーがバトルゾーンを離れる時、かわりにこのクリーチャーの下にあるカードをすべて、同じ行き先へ置く）
    abilities:
      - kind: replace
        when: {event: move, from: bz, subject: self}
        if: {cmp: [{count: {under_of: self}}, ">=", 1]}
        instead:
          - {op: move_under_to_event}
  must_attack:
    ja: このクリーチャーは、可能なら毎ターン攻撃する
    abilities:
      - {kind: static, affects: self, mod: {require: [attack]}}
  summon_from_mana:
    ja: このクリーチャーを自分のマナゾーンから召喚してもよい
    abilities:
      - {kind: static, zone: mana, affects: self, mod: {allow: [summon_from_mana]}}
  summon_from_graveyard:
    ja: このクリーチャーを自分の墓地から召喚してもよい（アビスラッシュの付随処理は付かない）
    abilities:
      - {kind: static, zone: graveyard, affects: self, mod: {allow: [summon_from_graveyard]}}
  yobinion:
    ja: ヨビニオン（このクリーチャーが召喚によって出た時、自分の山札の上から、これよりコストが小さいクリーチャーが出るまで表向きにしてもよい。そのクリーチャーを出す。残りをシャッフルし、山札の下に置く）
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self, reason: summon}
        effect:
          - op: may
            body:
              - {op: yobinion}
  z_rush:      # Zラッシュ: 常在型。シールドが離れた際、その時点でバトルゾーンにいる Zラッシュ持ちのハイパーモードを即座に解放する（適用はイベント適用側。公式Q&A 48466）
    ja: Zラッシュ（シールドが離れたら、次の自分のターンのはじめまで、このクリーチャーのハイパーモードを解放する）
    abilities: []
  rensa:       # 連鎖（バンドB U2 の精査で追加。設計書 design-full-bandB §3 の定義どおり）
    ja: 連鎖（このクリーチャーをバトルゾーンに出した時、自分の山札の上から１枚目を見る。そのカードが、このクリーチャーよりコストが小さいクリーチャーであれば、バトルゾーンに出してもよい）
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
