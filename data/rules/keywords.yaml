# キーワード能力の定義（設計判断④⑥）
# どのキーワードも「能力の並び」に展開される。ルール側（攻撃・ブロック・ブレイク処理など）は
# キーワード名を見ず、常在型能力が与える許可・禁止（permissions.yaml）と数値（breaks など）だけを見る。
# 新しいキーワードはここに足す。エンジンのコードは変えない。
#
# static の mod で使えるもの:
#   power: N            パワー修整
#   grant: [kw...]      キーワードを与える（与えたキーワードの常在型能力も働く）
#   allow: [act...]     行為を許可する（permissions.yaml）。要素は名前か {action, other: filter}
#   deny:  [act...]     行為を禁止する。「できない」は「できる」に勝つ（101.2）
#   breaks: N           ブレイクするシールドの数（大きい方を使う）
#   ignore: [ability kinds]  能力を無視する（608.4, 608.5）
# zone: 能力が機能するゾーン（既定 bz）。S・トリガーはシールドゾーンで機能する。
keywords:
  blocker:
    ja: ブロッカー
    abilities:
      - {kind: static, affects: self, mod: {allow: [block]}}
  speed_attacker:
    ja: スピードアタッカー
    abilities:
      - {kind: static, affects: self, mod: {allow: [attack_summoning_sick]}}
  s_trigger:
    ja: S・トリガー
    abilities:
      - {kind: static, zone: shield, affects: self, mod: {allow: [s_trigger]}}
  double_breaker:
    ja: W・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 2}}
  triple_breaker:
    ja: T・ブレイカー
    abilities:
      - {kind: static, affects: self, mod: {breaks: 3}}
  cannot_attack_player:
    ja: このクリーチャーは相手プレイヤーを攻撃できない
    abilities:
      - {kind: static, affects: self, mod: {deny: [attack_player]}}
  cannot_attack:
    ja: このクリーチャーは攻撃できない
    abilities:
      - {kind: static, affects: self, mod: {deny: [attack_player, attack_creature]}}
  unblockable:
    ja: このクリーチャーはブロックされない
    abilities:
      - {kind: static, affects: self, mod: {deny: [be_blocked]}}
  # 例: 誘発型を含むもの。「バトルゾーンに出た時、自分の山札の上から1枚目をマナゾーンに置く」
  mana_boost_cip:
    ja: (テスト用) 出た時マナ加速
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: move, select: {zone: deck, owner: you, from_top: 1}, to: mana, reason: put}
  slayer:
    ja: スレイヤー（このクリーチャーがバトルで負けた時、相手のクリーチャーも破壊する）
    abilities:
      - {kind: static, affects: self, mod: {allow: [slayer]}}
  # card: カード自体の性質を変えるキーワード（呪文の解決後の置き場所など）
  charger:
    ja: チャージャー（この呪文を唱えた後、墓地に置くかわりに自分のマナゾーンに置く）
    abilities: []
    card: {resolve_to: mana}
  spell_to_hand:      # 試験用: この呪文を唱えた後、墓地に置くかわりに手札に戻す（回収型呪文のループ検証）
    ja: この呪文を唱えた後、墓地に置くかわりに手札に戻す
    abilities: []
    card: {resolve_to: hand}
  evo_charger:
    ja: Evoチャージャー（チャージャーの後、マナのクリーチャー1体を自分の進化クリーチャーの下に重ねてもよい）
    abilities: []
    card:
      resolve_to: mana
      after_resolve:
        - op: may
          body:
            - op: put_under
              select: {zone: mana, owner: you, filter: {types: [creature]}, count: 1}
              onto: {zone: bz, owner: you, filter: {types: [evolution]}, count: 1}

  # EXライフ: 出す時に山札の上1枚をシールド化して紐付け、離れる時はかわりにそのシールドを墓地に置く。
  # シールド化は engine/events.py の _exlife_shield（出す時の状態定義。出た時の能力より先）。
  # 公式総合ルール Ver.1.53 には定義がない（701.33b の例で名前が出るだけ）。公式カード・裁定による。
  ex_life:
    ja: EXライフ
    abilities:
      - kind: replace
        when: {event: move, from: bz, subject: self}
        if: {exists: {exlife_of: self}}
        instead:
          - {op: move, select: {exlife_of: self, count: 1}, to: graveyard, reason: put}
