# 注釈・数値つきキーワード能力（rule_convert が正規表現で照合し、能力の並びに展開する）
# re: 比較用に正規化した文（NFKC・空白と読点を除く・注釈カッコ除去）に完全一致させる。
# abilities: 展開先。{1} {2} は括弧のグループ（整数）に置き換わる。
# エンジンの既存の演算だけで書けるものだけをここに置く。足りないものは docs/offload.md の「未対応」に書く。
# noise: 原文に出てくるが能力ではない記号。除いて照合する（{GS} は G・ストライクの印）
# マナゾーンに置く時のタップは多色カードのルール（405.1）の注釈で、カードの能力ではない
noise:
  - "{GS}"
  - マナゾーンに置く時、このカードはタップして置く。
  # コスト軽減の下限の念押し（エンジンは常に0で止める）。モデルに渡しても情報が増えない
  - ただし、コストは0以下にはならない。
  - ただし、コストは0以下にならない。
  - ただしコストは0以下にならない。
  - ただし、コストは1より少なくならない。
patterns:
  power_attacker:
    re: 'パワーアタッカー([+＋]\d+)'
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        effect:
          - {op: modify, select: {ref: self}, mod: {power: "{1}"}, duration: end_of_turn}
  mach_fighter:
    re: 'マッハファイター'
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: modify, select: {ref: self}, mod: {allow: [{action: attack_creature, other: {tapped: false}}]}, duration: end_of_turn}
  just_diver:
    re: 'ジャストダイバー'
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: modify, select: {ref: self}, mod: {deny: [be_chosen, be_attacked]}, duration: until_next_own_turn_start}
  # ニンジャ・ストライク N: 相手のクリーチャーが攻撃またはブロックした時、マナがN枚以上なら手札からコストを支払わずに召喚（そのターンの終わりに山札の下へ）
  ninja_strike:
    re: 'ニンジャ・ストライク(\d+)'
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: opp}}
        if: {cmp: [{count: {zone: mana, owner: you}}, ">=", "{1}"]}
        effect:
          - {op: play_free, select: {ref: self}, as: ninja}
          - op: delayed_trigger
            when: {event: turn_end}
            effect:
              - {op: move, select: {ref: ninja}, to: deck, reason: put, position: bottom}
      - kind: declare
        zone: hand
        when: {event: block, subject: {owner: opp}}
        if: {cmp: [{count: {zone: mana, owner: you}}, ">=", "{1}"]}
        effect:
          - {op: play_free, select: {ref: self}, as: ninja}
          - op: delayed_trigger
            when: {event: turn_end}
            effect:
              - {op: move, select: {ref: ninja}, to: deck, reason: put, position: bottom}
  # 革命チェンジ：<条件>（条件の読み取りは rule_convert の _build_revolution_change）
  revolution_change:
    re: '革命チェンジ[:：](.+)'
    builder: revolution_change

  # ---- 効果の1文（whole_line: その文が1行の全体の時だけ。続く文を取りこぼさないため）----
  etb_draw:
    re: '{TRG}カードを(\d)枚引く'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: draw, count: "{1}"}
  etb_draw_may:
    re: '{TRG}カードを(\d)枚引いてもよい'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - op: may
            body: [{op: draw, count: "{1}"}]
  etb_mana_charge:
    re: '{TRG}自分の山札の上から1枚目をマナゾーンに置く'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: move, select: {zone: deck, owner: you, from_top: 1}, to: mana, reason: put}
  etb_mill:
    re: '{TRG}自分の山札の上から(\d)枚を墓地に置く'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: mill, owner: you, count: "{1}"}
  etb_shield_to_hand:
    re: '{TRG}自分のシールドを(\d)つ手札に加える'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: move, select: {zone: shield, owner: you, count: "{1}"}, to: hand, reason: return}
  etb_destroy_power:
    re: '{TRG}相手のパワー(\d+)以下のクリーチャーを1体破壊する'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: destroy, select: {zone: bz, owner: opp, filter: {types: [creature], power_le: "{1}"}, count: 1}}
  etb_destroy:
    re: '{TRG}相手のクリーチャーを1体破壊する'
    whole_line: true
    abilities:
      - kind: trigger
        when: $TRG
        effect:
          - {op: destroy, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}}
  end_of_turn_untap:
    re: '自分のターンの終わりにこのクリーチャーをアンタップする'
    whole_line: true
    abilities:
      - kind: trigger
        when: {event: turn_end, player: you}
        effect:
          - {op: untap, select: {ref: self}}
  end_of_turn_untap_may:
    re: '自分のターンの終わりにこのクリーチャーをアンタップしてもよい'
    whole_line: true
    abilities:
      - kind: trigger
        when: {event: turn_end, player: you}
        effect:
          - op: may
            body: [{op: untap, select: {ref: self}}]
  destroyed_to_mana:
    re: 'このクリーチャーが破壊される時墓地に置くかわりに(?:自分の)?マナゾーンに置く'
    whole_line: true
    abilities:
      - kind: replace
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        instead:
          - {op: move, select: {ref: self}, to: mana, reason: put}
  destroyed_to_hand:
    re: 'このクリーチャーが破壊される時墓地に置くかわりに(?:自分の)?手札に戻す'
    whole_line: true
    abilities:
      - kind: replace
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        instead:
          - {op: move, select: {ref: self}, to: hand, reason: return}
  attack_untapped_creatures:
    re: 'このクリーチャーはタップされていないクリーチャーを攻撃できる'
    whole_line: true
    abilities:
      - {kind: static, affects: self, mod: {allow: [{action: attack_creature, other: {tapped: false}}]}}

  # マジボンバーN: 攻撃する時、コストN以下のクリーチャーを1体、自分の手札または山札の上から1枚目から、バトルゾーンに出してもよい（見る手順は選択に含まれる）
  magic_bomber:
    re: 'マジボンバー(\d)'
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        effect:
          - op: may
            body:
              - {op: move, select: {zone: [hand, deck], from_top: 1, owner: you, filter: {types: [creature], not_types: [evolution], cost_le: "{1}"}, count: 1}, to: bz, reason: put}

  # ---- コスト ----
  # シンパシー：<対象>（<対象>1体につきNコストが少なくなる）。N は注釈から取り出す（_prenorm）。対象の読み取りは _build_sympathy
  sympathy:
    re: 'シンパシー:(.+):(\d+)'
    builder: sympathy
  # 自分の<対象>の召喚コストをN少なくする／相手の<対象>を唱えるコストはN多くなる（常在型）
  cost_static_reduce:
    re: '(自分)の(.+?)の(?:召喚コスト|コスト)を(\d+)(少なく)する'
    whole_line: true
    builder: cost_static
  cost_static_increase:
    re: '(相手)の(.+?)(?:を唱えるコスト|の召喚コスト)は(\d+)(多く)なる'
    whole_line: true
    builder: cost_static

  # ササゲールN: ディスペクターを召喚する時、このクリーチャーを破壊してコストをN少なくしてもよい（召喚側で選ぶ）
  sasagale:
    re: 'ササゲール(\d)'
    abilities:
      - {kind: static, affects: self, mod: {sac_reduce: "{1}"}}

  # B・A・DN / J・O・EN: コストをN少なくして実行してもよい。そうしたら、そのターンの終わりに破壊する／山札の一番下に置き、その後カードを1枚引く
  bad:
    re: 'B・A・D(\d)'
    abilities:
      - {kind: static, affects: self, zone: hand, mod: {opt_reduce: {amount: "{1}", then: destroy}}}
  joe:
    re: 'J・O・E(\d)'
    abilities:
      - {kind: static, affects: self, zone: hand, mod: {opt_reduce: {amount: "{1}", then: deck_bottom_draw}}}

  # 自分のクリーチャーすべてに「スピードアタッカー」を与える（辞書にあるキーワードだけ）
  grant_all_mine:
    re: '自分のクリーチャーすべてに[「｢]([^」｣]+)[」｣]を与える'
    whole_line: true
    builder: grant_all

# ---- 呪文の効果文（呪文の解決で行う ops）。1行まるごとがこの文の時だけ変換する。行は書かれた順に並べる ----
# re は patterns と同じ正規化（NFKC・空白と読点を除く・注釈除去）に完全一致させる
spell_effects:
  draw:
    re: 'カードを(\d)枚引く'
    spell: [{op: draw, count: "{1}"}]
  mana_charge_one:
    re: '自分の山札の上から1枚目をマナゾーンに置く'
    spell: [{op: move, select: {zone: deck, owner: you, from_top: 1}, to: mana, reason: put}]
  mana_charge_n:
    re: '自分の山札の上から(\d)枚をマナゾーンに置く'
    spell: [{op: move, select: {zone: deck, owner: you, from_top: "{1}"}, to: mana, reason: put}]
  mill:
    re: '自分の山札の上から(\d)枚を墓地に置く'
    spell: [{op: mill, owner: you, count: "{1}"}]
  destroy_power:
    re: '相手のパワー(\d+)以下のクリーチャーを(\d)体(?:選び)?破壊する'
    spell: [{op: destroy, select: {zone: bz, owner: opp, filter: {types: [creature], power_le: "{1}"}, count: "{2}"}}]
  destroy_n:
    re: '(?:バトルゾーンにある)?相手のクリーチャーを(\d)体(?:選び)?破壊する'
    spell: [{op: destroy, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: "{1}"}}]
  tap_all_opp:
    re: '(?:バトルゾーンにある)?相手のクリーチャーをすべてタップする'
    spell: [{op: tap, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: all}}]
  tap_n_opp:
    re: '(?:バトルゾーンにある)?相手のクリーチャーを(\d)体選びタップする'
    spell: [{op: tap, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: "{1}"}}]
  bounce_opp:
    re: '(?:バトルゾーンにある)?相手のクリーチャーを(\d)体選び持ち主の手札に戻す'
    spell: [{op: bounce, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: "{1}"}}]
  bounce_any:
    re: 'バトルゾーンにあるクリーチャーを(\d)体選び持ち主の手札に戻す'
    spell: [{op: bounce, select: {zone: bz, owner: any, filter: {types: [creature]}, count: "{1}"}}]
  graveyard_to_hand:
    re: 'クリーチャーを(\d)体自分の墓地から手札に戻す'
    spell: [{op: move, select: {zone: graveyard, owner: you, filter: {types: [creature]}, count: "{1}"}, to: hand, reason: return}]
  opp_discard:
    re: '相手の手札を(\d)枚見ないで選び捨てさせる'
    spell: [{op: discard, select: {zone: hand, owner: opp, count: "{1}"}}]
  power_down:
    re: '相手のクリーチャーを(\d)体選ぶこのターンそのクリーチャーのパワーを-(\d+)する'
    spell:
      - {op: choose, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: "{1}"}, as: target}
      - {op: modify, select: {ref: target}, mod: {power: "-{2}"}, duration: end_of_turn}
