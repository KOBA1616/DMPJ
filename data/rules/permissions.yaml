# 許可・禁止できる行為（101.2:「できない」効果は「できる」効果に勝つ）
# default: どの効果もない時に、その行為ができるか
# 判定: 禁止が1つでも当てはまれば不可 → 許可が当てはまれば可 → default
# other: 相手側のカードに条件を付ける時の、相手側の役割（攻撃先・攻撃クリーチャー・ブロッカー）
actions:
  attack_player:         {default: true,  rule: "506.1a", ja: プレイヤーを攻撃できる}
  attack_creature:       {default: true,  rule: "506.1e", other: target,   ja: クリーチャーを攻撃できる}
  attack_summoning_sick: {default: false, rule: "506.1a", ja: 出たターンに攻撃できる}
  be_attacked:           {default: true,  rule: "506.1e", other: attacker, ja: 攻撃される}
  block:                 {default: false, rule: "507.1a", other: attacker, ja: ブロックできる（ブロッカー）}
  be_blocked:            {default: true,  rule: "507.1a", other: blocker,  ja: ブロックされる}
  s_trigger:             {default: false, rule: "113.6",  ja: S・トリガーとして使える}
  untap_at_start:        {default: true,  rule: "501.1",  ja: ターンのはじめにアンタップする}
  enter_bz:              {default: true,  rule: "unverified", ja: バトルゾーンに出せる（「コスト７以下のクリーチャーを出せない」。召喚・効果・革命チェンジすべて）}
  summon:                {default: true,  rule: "601",    ja: 召喚できる}
  summon_from_graveyard: {default: false, rule: "unverified", ja: 墓地から召喚できる（アビスラッシュ）}
  summon_from_mana:      {default: false, rule: "unverified", ja: マナゾーンから召喚できる}
  cast_from_graveyard:   {default: false, rule: "unverified", ja: 墓地から唱えられる（許可型。第226弾）}
  cross_free:            {default: false, rule: "303.3b", ja: コストを支払わずにクロスできる}
  cast_free:             {default: false, rule: "601",    ja: コストを支払わずに唱えてもよい（呪文。アカシック3の常在型）}
  cast:                  {default: true,  rule: "601",    ja: 唱えられる}
  slayer:                {default: false, rule: "unverified", ja: バトルで負けた時、相手も破壊する}
  be_chosen:             {default: true,  rule: "unverified", ja: 相手に選ばれる}
  guardman:              {default: false, rule: "507.1a", other: attacker, ja: 攻撃先を自分の他のクリーチャーからこのクリーチャーに変更できる（ガードマン）}
  generate:              {default: true,  rule: "303.1, 308.1, 315.1", ja: タマシード・フィールド・クロスギアを実行できる}
  d_switch:              {default: true,  rule: "308.3", ja: Dスイッチを使える（D2フィールド。第151弾）}
  evolve_base:           {default: false, rule: "315 シンカライズ", ja: "クリーチャーでなくても進化元にできる（シンカライズ。タマシードがクリーチャーであるかのように）"}
  evolve_base_any:       {default: false, rule: "801.1a", ja: "どんな種族の進化クリーチャーの進化元にもなれる（イノセント形。第232弾）"}
  evolve_civ_any:        {default: false, rule: "801.1a", ja: "どんな文明の進化クロスギアの進化元にもなれる（レオパルド形。第304弾）"}
