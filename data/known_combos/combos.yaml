# parts[].role: core=コンボの主要部品（重なり検査の対象） / support=汎用の補助札（検査対象外）。
# 重なり規則: 異なる split に同じ core 部品（id、なければ name）があってはならない。
# status: verified=エンジンで再現済み / hypothesis=机上の仮説 / draft=名前・手順が未確定。
