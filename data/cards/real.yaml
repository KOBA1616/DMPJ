  - id: dmex17-w02
    name: 無双竜機ボルバルザーク
    types: [creature]
    civs: [fire, nature]
    cost: 7
    power: 6000
    races: [アーマード・ドラゴン, アース・ドラゴン]
    keywords: [speed_attacker, double_breaker]
    text: "スピードアタッカー / W・ブレイカー / 出た時、他のパワー6000のクリーチャーをすべて破壊する。その後、このターンの後に自分のターンを追加する。そのターンの終わりに、自分はゲームに負ける。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: destroy
            select: {zone: bz, owner: any, other: true, filter: {types: [creature], power_ge: 6000, power_le: 6000}, count: all}
          - {op: extra_turn}
