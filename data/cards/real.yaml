  - id: dm25-035
    name: 鎧亜の咆哮キリュー・ジルヴェス
    types: [creature]
    civs: [darkness, fire, nature]
    cost: 5
    power: 1000
    races: [ロスト・クルセイダー]
    text: "マナゾーンに置く時、このカードはタップして置く。 / このクリーチャーをバトルゾーンに出した時、そのターン、自分のクリーチャーはすべて「スピードアタッカー」と「スレイヤー」を得る。そのターン中、それらのクリーチャーが破壊される時、墓地に置くかわりに自分のマナゾーンに置く。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: modify
            select: {zone: bz, owner: you, filter: {types: [creature]}}
            dynamic: true
            mod:
              grant: [speed_attacker, slayer]
              gain:
                - kind: replace
                  when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
                  instead:
                    - {op: mana_put, select: {ref: event.subject}}
    source: {official: dm25-035, review: pending, notes: "多色なのでマナにはタップして置かれる（エンジンの規定）。「自分のクリーチャーはすべて」は後から出たものにも及ぶ（dynamic）と解釈した。要確認"}
