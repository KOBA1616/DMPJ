            effect:
              - op: delayed_trigger
                when: {event: turn_end, player: you}
                effect:
                  - {op: lose}
    source: {official: dmex17-w02, review: pending, notes: "多色なのでマナにはタップして置かれる（エンジンの規定）。「そのターンの終わりに」は、次の自分のターンの開始時に turn_end の遅延誘発を作って表した。追加ターンより前に別の自分のターンが入る効果とは組み合わせていない"}

