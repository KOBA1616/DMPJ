    source: {official: dmrp03-036, review: pending, notes: "メテオバーン等で墓地に置かれた時の誘発は、その効果の解決がすべて終わった後に解決する（公式裁定）。エンジンは前景の解決窓の後で誘発を解決するので自然に一致する"}

