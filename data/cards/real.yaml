  - id: dm22ex2-021
    name: 絶望神サガ
    types: [creature]
    civs: [water, darkness]
    cost: 3
    power: 3000
    races: [ゴッド, オリジン]
    text: "このクリーチャーが出た時、または自分のターンのはじめに、カードを１枚引き、自分の手札を１枚捨てる。その後、自分の墓地にクリーチャーが３体以上あれば、コスト５以下のゴッドまたはコスト５以下のオリジンを１体、自分の墓地から出してもよい。そうしたら、このクリーチャーを破壊する。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: draw, player: you, count: 1}
          - {op: discard, select: {zone: hand, owner: you, count: 1}}
          - op: if
            cond: {cmp: [{count: {zone: graveyard, owner: you, filter: {types: [creature]}}}, ">=", 3]}
            then:
              - op: may
                body:
                  - op: if
                    cond: {exists: {zone: graveyard, owner: you, filter: {types: [creature], races: [ゴッド, オリジン], cost_le: 5}}}
                    then:
                      - {op: move, select: {zone: graveyard, owner: you, filter: {types: [creature], races: [ゴッド, オリジン], cost_le: 5}, count: 1}, to: bz, reason: put}
                      - {op: destroy, select: {ref: self}}
      - kind: trigger
        when: {event: turn_start, player: you}
        effect:
          - {op: draw, player: you, count: 1}
          - {op: discard, select: {zone: hand, owner: you, count: 1}}
          - op: if
            cond: {cmp: [{count: {zone: graveyard, owner: you, filter: {types: [creature]}}}, ">=", 3]}
            then:
              - op: may
                body:
                  - op: if
                    cond: {exists: {zone: graveyard, owner: you, filter: {types: [creature], races: [ゴッド, オリジン], cost_le: 5}}}
                    then:
                      - {op: move, select: {zone: graveyard, owner: you, filter: {types: [creature], races: [ゴッド, オリジン], cost_le: 5}, count: 1}, to: bz, reason: put}
                      - {op: destroy, select: {ref: self}}
    source: {official: dm22ex2-021, review: pending, notes: "ループの核: 1ドロー1捨て＋サガ同士が墓地⇔バトルゾーンを行き来して、1回の起動で山札を1枚減らす"}

