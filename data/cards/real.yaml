  - id: dm24ex4-015
    name: ボルメテウス・レインボー・ドラゴン
    types: [creature]
    civs: [light, fire]
    cost: 7
    power: 11000
    races: [アーマード・ドラゴン]
    keywords: [double_breaker]
    text: "革命チェンジ：光または火の、コスト５以上のドラゴン / W・ブレイカー / 自分の、名前に《ボルメテウス》とあるクリーチャーすべてに「スピードアタッカー」を与える。 / このクリーチャーが出た時、このクリーチャーは自分のシールドを１つブレイクしてもよい。 / 自分のシールドゾーンにあるコスト７以下のドラゴンすべてに「S・トリガー」を与える。"
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: you, filter: {civs: [light, fire], cost_ge: 5, race_has: ドラゴン}}}
        effect:
          - {op: swap, out: {ref: event.subject}, in: {ref: self}}
      - kind: static
        affects: {owner: you, filter: {name_has: ボルメテウス}}
        mod: {grant: [speed_attacker]}
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: may
            body: [{op: break, player: you, count: 1}]
      - kind: static
        affects: {owner: you, zone: shield, filter: {cost_le: 7, race_has: ドラゴン}}
        mod: {grant: [s_trigger]}
    source: {official: dm24ex4-015, review: pending}

