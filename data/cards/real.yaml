  - id: dmx12b-031
    name: 光霊姫アレフティナ
    types: [creature]
    civs: [light]
    cost: 4
    power: 8000
    races: [メカ・デル・ソル, アーク・セラフィム]
    keywords: [double_breaker]
    text: "このクリーチャーを召喚するコストは、自分のシールドひとつにつき１多くなる。 / 相手のクリーチャーが自分を攻撃する時、それがそのターンはじめての自分への攻撃で、自分のシールドが１枚もない場合、自分の山札の上から１枚目を裏向きのまま、新しいシールドとして自分のシールドゾーンに加える。 / 自分のシールドが10枚以上あれば、自分はゲームに勝利する。 / W・ブレイカー"
    abilities:
      - kind: static
        zone: hand
        affects: self
        mod: {cost: {count: {zone: shield, owner: you}, amount: 1}}
      - kind: trigger
        when: {event: attack, subject: {owner: opp}, target: player}
        if: {cmp: [{count: {zone: shield, owner: you}}, "==", 0]}
        effect:
          - {op: move, select: {zone: deck, owner: you, from_top: 1}, to: shield, reason: put}
      - kind: state
        if: {cmp: [{count: {zone: shield, owner: you}}, ">=", 10]}
        effect:
          - {op: win, player: you}
    source: {official: dmx12b-031, review: pending, notes: "攻撃先がプレイヤー（シールド含む）の時だけ。盾が0枚の時の攻撃は「そのターンはじめて」になる。盾10枚以上は kind: state（状況起因処理で常に判定）"}
