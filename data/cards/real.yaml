  - id: dm10-036
    name: 母なる大地
    types: [spell]
    civs: [nature]
    cost: 3
    keywords: [s_trigger]
    text: "S・トリガー / バトルゾーンにあるクリーチャーを１体選び、持ち主のマナゾーンに置いてもよい。そうした場合、そのマナゾーンにあるカードの枚数とコストが同じかそれ以下のクリーチャーを１体、そのマナゾーンから選ぶ。そのプレイヤーはそのクリーチャーをバトルゾーンに出す。ただし、進化クリーチャーを選ぶことはできない。"
    spell:
      - op: may
        body:
          - {op: mana_put, select: {zone: bz, owner: any, filter: {types: [creature]}, count: 1}, as: sent}
          - op: if
            cond: {exists: {ref: sent}}
            then:
              - op: move
                select:
                  zone: mana
                  owner_of: sent
                  filter:
                    types: [creature]
                    not_types: [evolution]
                    cost_le: {count: {zone: mana, owner_of: sent}}
                  count: 1
                to: bz
                reason: put
    source: {official: dm10-036, review: pending, notes: "マナに置いた後のカードを as: sent で追う。出す処理はマナの持ち主のバトルゾーン"}

