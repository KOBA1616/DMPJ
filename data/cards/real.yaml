  - id: dm29-037
    name: 光牙忍ハヤブサマル
    types: [creature]
    civs: [light]
    cost: 3
    power: 3000
    races: [ガーディアン, シノビ]
    text: "ニンジャ・ストライク４ / このクリーチャーをバトルゾーンに出した時、次の自分のターンのはじめまで、バトルゾーンにある自分のクリーチャー１体は「ブロッカー」を得る。"
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: opp}}
        if: {cmp: [{count: {zone: mana, owner: you}}, ">=", 4]}
        effect: &ninja
          - {op: play_free, select: {ref: self}, as: ninja}
          - op: delayed_trigger
            when: {event: turn_end}
            effect:
              - {op: move, select: {ref: ninja}, to: deck, reason: put, position: bottom}
      - kind: declare
        zone: hand
        when: {event: block, subject: {owner: opp}}
        if: {cmp: [{count: {zone: mana, owner: you}}, ">=", 4]}
        effect: *ninja
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: modify
            select: {zone: bz, owner: you, filter: {types: [creature]}, count: 1}
            mod: {grant: [blocker]}
            duration: until_next_own_turn_start
    source:
      official: dm29-037
      review: pending
      notes: "「その攻撃中にニンジャ・ストライクを使っていなかった場合」の制限は未実装（1回の攻撃で複数のニンジャ・ストライクを宣言できてしまう）"

