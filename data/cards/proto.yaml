            - {cmp: [{count: {zone: bz, owner: you, filter: {civs: [nature]}}}, ">=", 1]}
        then:
          - op: may
            body:
              - op: modal
                count: 5
                modes:
                  - [{op: move, select: {zone: deck, owner: you, from_top: 1}, to: shield, reason: charge}]
                  - [{op: draw, count: 2}]
                  - [{op: discard, select: {zone: hand, owner: opp, count: 1, chooser: random}}]
