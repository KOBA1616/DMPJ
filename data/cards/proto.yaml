    name: D・D・D決断試験呪文
    civs: [light, water, nature]
    cost: 4
    types: [spell]
    races: [テスト]
    text: この呪文の「D・D・D」をマナゾーンから使ってもよい。D・D・D [lwn05]（自分のクリーチャーが攻撃する時、このカードを [lwn05] 支払って自分の手札またはマナゾーンから実行してもよい）。次の中から２回選ぶ。この呪文を「D・D・D」で唱えたなら、かわりに３回選んでもよい。（同じものを選んでもよい）▶カードを１枚引く。▶自分の山札の上から１枚を墓地に置く。▶自分のマナゾーンにあるカードを１枚アンタップする。
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: you, filter: {types: [creature]}}}
        effect:
          - op: may
            body:
              - {op: play_self, cost: 5, civs: [light, water, nature], via: d_d_d}
      - kind: declare
        zone: mana
        when: {event: attack, subject: {owner: you, filter: {types: [creature]}}}
        effect:
          - op: may
            body:
              - {op: play_self, cost: 5, civs: [light, water, nature], via: d_d_d}
    spell:
      - op: if
        cond: {ddd_paid: true}
        then:
          - op: modal
            count: 3
            repeat: true
            modes: &t188_modes
              - [{op: draw, count: 1}]
              - [{op: mill, owner: you, count: 1}]
              - [{op: untap, select: {zone: mana, owner: you, count: 1}}]
        else:
          - op: modal
            count: 2
            repeat: true
            modes: *t188_modes
