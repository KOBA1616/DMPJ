  - id: T974
    name: 試験用五文明の決断
    types: [spell]
    civs: [light, water, darkness, fire, nature]
    cost: 5
    mana: 1
    spell:
      - op: if
        cond:
          all:
            - {cmp: [{count: {zone: bz, owner: you, filter: {civs: [light]}}}, ">=", 1]}
            - {cmp: [{count: {zone: bz, owner: you, filter: {civs: [water]}}}, ">=", 1]}
