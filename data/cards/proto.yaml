# プロトタイプ検証用の架空カード（実在カードではない。ID は T 始まり）
# 実カードは公式テキスト → LLM変換 → 人の確認 を経てこの形式で追加する
cards:
  - id: T001
    name: 試験用ダミー
    types: [creature]
    civs: [nature]
    cost: 2
    power: 2000
    races: [テスト]
    text: ""

  - id: T002
    name: マナ芽吹きの精
    types: [creature]
    civs: [nature]
    cost: 2
    power: 1000
    races: [テスト]
    text: このクリーチャーがバトルゾーンに出た時、自分の山札の上から1枚目をマナゾーンに置く。
    keywords: [mana_boost_cip]

  - id: T003
    name: 知識の泉
    types: [spell]
    civs: [water]
    cost: 2
    text: カードを2枚引く。
    spell:
      - {op: draw, player: you, count: 2}

  - id: T004
    name: 迎撃の盾兵
    types: [creature]
    civs: [light]
    cost: 3
    power: 3000
    races: [テスト]
    text: ブロッカー
    keywords: [blocker]

  - id: T005
    name: 疾風の突撃兵
    types: [creature]
    civs: [fire]
    cost: 3
    power: 3000
    races: [テスト]
    text: スピードアタッカー / W・ブレイカー
    keywords: [speed_attacker, double_breaker]

  - id: T006
    name: テスト・トルネード
    types: [spell]
    civs: [fire]
    cost: 3
    text: S・トリガー / 相手のパワー4000以下のクリーチャーを1体破壊する。
    keywords: [s_trigger]
    spell:
      - op: destroy
        select: {zone: bz, owner: opp, filter: {types: [creature], power_le: 4000}, count: 1}

  - id: T007
    name: 身代わりの苗木
    types: [creature]
    civs: [nature]
    cost: 2
    power: 2000
    races: [テスト]
    text: このクリーチャーが破壊される時、墓地に置くかわりにマナゾーンに置いてもよい。
    abilities:
      - kind: replace
        optional: true
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        instead:
          - {op: mana_put, select: {ref: event.subject}}

  - id: T008
    name: 墓守のしもべ
    types: [creature]
    civs: [darkness]
    cost: 2
    power: 1000
    races: [テスト]
    text: このクリーチャーが破壊された時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        effect:
          - {op: draw, player: you, count: 1}

  # ループ検証用の2枚コンボ: T009 を出すたびに T010 がマナを戻して T009 を手札へ。1周で相手の山札 -1
  - id: T009
    name: 回帰のこだま
    types: [creature]
    civs: [water]
    cost: 1
    power: 1000
    races: [テスト]
    text: このクリーチャーがバトルゾーンに出た時、相手の山札の上から1枚目を墓地に置く。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: mill, owner: opp, count: 1}

  - id: T010
    name: 還流の大精霊
    types: [creature]
    civs: [water]
    cost: 4
    power: 4000
    races: [テスト]
    text: 自分の他のクリーチャーがバトルゾーンに出た時、自分のマナゾーンのカードを1枚アンタップしてもよい。そうした場合、そのクリーチャーを手札に戻す。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: {owner: you, other: true, filter: {types: [creature]}}}
        effect:
          - op: may
            body:
              - {op: untap, select: {zone: mana, owner: you, filter: {tapped: true}, count: 1}}
              - {op: bounce, select: {ref: event.subject}}

  - id: T011
    name: 乱打の呪文
    types: [spell]
    civs: [fire]
    cost: 2
    text: 自分のクリーチャーを1体破壊する。その後、相手のシールドを1つブレイクする。
    spell:
      - op: destroy
        select: {zone: bz, owner: you, filter: {types: [creature]}, count: 1}
      - {op: break, player: opp, count: 1}

  - id: T012
    name: 底なしの知恵
    types: [spell]
    civs: [water]
    cost: 1
    text: 相手はカードを1枚引く。
    spell:
      - {op: draw, player: opp, count: 1}

  # ---- ステップ3で足した処理の検証用 ----
  - id: T013
    name: 封鎖の結界
    types: [spell]
    civs: [light]
    cost: 1
    text: 次の自分のターンのはじめまで、相手のクリーチャーは攻撃できない。次の相手のターンのドローステップを飛ばす。
    spell:
      - op: modify
        select: {zone: bz, owner: opp}
        mod: {deny: [attack_player, attack_creature]}
        dynamic: true
        duration: until_next_own_turn_start
      - {op: step_mod, player: opp, step: draw, mode: skip}

  - id: T014
    name: 解放の号令
    types: [spell]
    civs: [fire]
    cost: 1
    text: このターン、自分のクリーチャーすべてに「スピードアタッカー」を与える。
    spell:
      - {op: modify, select: {zone: bz, owner: you, count: all}, mod: {grant: [speed_attacker]}}

  - id: T015
    name: 沈黙の司祭
    types: [creature]
    civs: [light]
    cost: 3
    power: 2000
    races: [テスト]
    text: 相手のクリーチャーの能力をすべて無視する。
    abilities:
      - {kind: static, affects: {owner: opp}, mod: {ignore: [all]}}

  - id: T016
    name: 沈黙の反逆者
    types: [creature]
    civs: [darkness]
    cost: 3
    power: 2000
    races: [テスト]
    text: 相手のクリーチャーの能力をすべて無視する。
    abilities:
      - {kind: static, affects: {owner: opp}, mod: {ignore: [all]}}

  - id: T017
    name: 進化の守護者
    types: [creature, evolution]
    civs: [nature]
    cost: 2
    power: 6000
    races: [テスト]
    text: 進化—自分の自然のクリーチャー1体の上に置く。W・ブレイカー
    keywords: [double_breaker]
    evolve_from: {civs: [nature]}

  - id: T018
    name: 双刃の竜／双刃の呪
    mana: 1
    text: "クリーチャー側: パワー3000 / 呪文側: S・トリガー 相手のクリーチャーを1体手札に戻す"
    faces:
      - name: 双刃の竜
        types: [creature]
        civs: [fire]
        cost: 4
        power: 3000
        races: [テスト]
      - name: 双刃の呪
        types: [spell]
        civs: [water]
        cost: 2
        keywords: [s_trigger]
        spell:
          - {op: bounce, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}}

  - id: T019
    name: 影走りのシノビ
    types: [creature]
    civs: [darkness]
    cost: 5
    power: 4000
    races: [テスト]
    text: ニンジャ・ストライク 2（相手のクリーチャーが攻撃した時、自分のマナが2枚以上なら、このクリーチャーをコストを支払わずに召喚してもよい。ターンの終わりに、このクリーチャーを山札の一番下に置く）/ ブロッカー
    keywords: [blocker]
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: opp}}
        if: {cmp: [{count: {zone: mana, owner: you}}, ">=", 2]}
        effect:
          - {op: play_free, select: {ref: self}, as: ninja}
          - op: delayed_trigger
            when: {event: turn_end}
            effect:
              - {op: move, select: {ref: ninja}, to: deck, reason: put, position: bottom}

  - id: T020
    name: 革命の旗手
    types: [creature]
    civs: [fire]
    cost: 7
    power: 9000
    races: [テスト]
    text: 革命チェンジ—火のクリーチャー（自分の火のクリーチャーが攻撃する時、そのクリーチャーと手札のこのクリーチャーを入れ替えてもよい）/ T・ブレイカー
    keywords: [triple_breaker]
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: you, filter: {civs: [fire]}}}
        effect:
          - {op: swap, out: {ref: event.subject}, in: {ref: self}}

  - id: T021
    name: 枯渇の監視者
    types: [creature]
    civs: [darkness]
    cost: 6
    power: 5000
    races: [テスト]
    text: 自分のターンのはじめに、相手のマナゾーンのカードをすべて墓地に置く。
    abilities:
      - kind: trigger
        when: {event: turn_start, player: you}
        effect:
          - {op: move, select: {zone: mana, owner: opp, count: all}, to: graveyard, reason: put}

  - id: T022
    name: 遅れの罠
    types: [spell]
    civs: [darkness]
    cost: 1
    text: このターン、次に相手のクリーチャーが破壊された時、カードを1枚引く。
    spell:
      - op: delayed_trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: {owner: opp}}
        effect:
          - {op: draw, count: 1}

  # ---- 語彙パイロット（2026-10-30）: move tapped / tap no_untap_next / enters_tapped / force_battle ----
  - id: T023
    name: 試験用タップマナ呪文
    types: [spell]
    civs: [nature]
    cost: 1
    text: 自分の山札の上から2枚を、タップしてマナゾーンに置く。
    spell:
      - {op: move, select: {zone: deck, owner: you, from_top: 2}, to: mana, reason: put, tapped: true}

  - id: T024
    name: 試験用凍結呪文
    types: [spell]
    civs: [water]
    cost: 1
    text: 相手のクリーチャーを1体選び、タップする。そのクリーチャーは、次の相手のターンのはじめにアンタップしない。
    spell:
      - {op: tap, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, no_untap_next: true}

  - id: T025
    name: 試験用タップ出動兵
    types: [creature]
    civs: [fire]
    cost: 2
    power: 3000
    races: [テスト]
    text: このクリーチャーは、タップしてバトルゾーンに出る。
    keywords: [enters_tapped]

  - id: T026
    name: 試験用決闘兵
    types: [creature]
    civs: [fire]
    cost: 3
    power: 5000
    races: [テスト]
    text: このクリーチャーが出た時、相手のクリーチャーを1体選んでもよい。その選んだクリーチャーとこのクリーチャーをバトルさせる。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: may
            body:
              - {op: choose, select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}, as: tgt}
              - {op: force_battle, a: {ref: self}, b: {ref: tgt}}

  # ---- 語彙パイロット第2弾（2026-10-30）: once_per_turn / first_time / civ_count / アンタップB型 ----
  - id: T027
    name: 試験用見張り兵
    types: [creature]
    civs: [fire]
    cost: 2
    power: 1000
    races: [テスト]
    text: 各ターンに一度、自分の他のクリーチャーが出た時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: {owner: you, other: true, filter: {types: [creature]}}}
        once_per_turn: true
        effect:
          - {op: draw, count: 1}

  - id: T028
    name: 試験用烽火兵
    types: [creature]
    civs: [fire]
    cost: 2
    power: 1000
    races: [テスト]
    text: 各ターン、はじめて自分のクリーチャーが攻撃する時、カードを1枚引く。
    abilities:
      - kind: trigger
        when: {event: attack, subject: {owner: you, filter: {types: [creature]}}}
        first_time: true
        effect:
          - {op: draw, count: 1}

  - id: T029
    name: 試験用文明観測呪文
    types: [spell]
    civs: [water]
    cost: 1
    text: 自分のマナゾーンにある文明の数だけ、カードを引く。
    spell:
      - {op: draw, count: {civ_count: {zone: mana, owner: you}}}

  - id: T030
    name: 試験用双色兵
    types: [creature]
    civs: [light, water]
    cost: 2
    power: 2000
    races: [テスト]
    text: ""

  - id: T031
    name: 試験用文明蓄積兵
    types: [creature]
    civs: [nature]
    cost: 3
    power: 1000
    races: [テスト]
    text: このクリーチャーのパワーは、自分のマナゾーンにある文明ひとつにつき+4000される。
    abilities:
      - kind: static
        affects: self
        mod: {power: {amount: 4000, count: {civ_count: {zone: mana, owner: you}}}}

  - id: T032
    name: 試験用期限凍結呪文
    types: [spell]
    civs: [water]
    cost: 1
    text: 相手のクリーチャーを1体選び、タップする。次の自分のターンのはじめまで、そのクリーチャーはアンタップしない。
    spell:
      - op: choose
        select: {zone: bz, owner: opp, filter: {types: [creature]}, count: 1}
        as: tgt
      - {op: tap, select: {ref: tgt}}
      - op: modify
        select: {ref: tgt}
        mod: {deny: [untap_at_start]}
        duration: until_next_own_turn_start

  - id: T033
    name: 試験用自軍期限凍結呪文
    types: [spell]
    civs: [water]
    cost: 1
    text: 自分のクリーチャーを1体選び、タップする。次の自分のターンのはじめまで、そのクリーチャーはアンタップしない。
    spell:
      - op: choose
        select: {zone: bz, owner: you, filter: {types: [creature]}, count: 1}
        as: tgt
      - {op: tap, select: {ref: tgt}}
      - op: modify
        select: {ref: tgt}
        mod: {deny: [untap_at_start]}
        duration: until_next_own_turn_start

  # ---- 語彙パイロット第3弾（2026-10-30）: freeze キーワード ----
  - id: T034
    name: 試験用凍結兵
    types: [creature]
    civs: [fire]
    cost: 3
    power: 3000
    races: [テスト]
    text: フリーズ（このクリーチャーが相手プレイヤーを攻撃してブロックされなかった時、バトルゾーンにある相手のクリーチャーを１体選び、タップしてもよい。そのクリーチャーは、次の相手のターンのはじめにアンタップしない）
    keywords: [freeze]

  # ---- 語彙パイロット第4弾（2026-10-30）: 鬼タイム条件（既存の if 条件で表現） ----
  - id: T035
    name: 試験用鬼兵
    types: [creature]
    civs: [darkness]
    cost: 3
    power: 2000
    races: [テスト]
    text: 鬼タイム：自分と相手のシールドの数が合計６つ以下なら、このクリーチャーのパワーを+3000する。
    abilities:
      - kind: static
        affects: self
        if: {cmp: [{sum: [{count: {zone: shield, owner: you}}, {count: {zone: shield, owner: opp}}]}, "<=", 6]}
        mod: {power: 3000}

  # ---- 語彙パイロット第5弾（2026-10-30）: 式 entered（このターンに出したクリーチャー数） ----
  - id: T036
    name: 試験用追随兵
    types: [creature]
    civs: [darkness]
    cost: 2
    power: 2000
    races: [テスト]
    text: このクリーチャーがバトルゾーンに出た時、そのターン中、すでに自分の他のクリーチャーがバトルゾーンに出ていれば、このターン、このクリーチャーに「スピードアタッカー」を与える。
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: if
            cond: {cmp: [{entered: {owner: you, other: true}}, ">=", 1]}
            then:
              - {op: modify, select: {ref: self}, mod: {grant: [speed_attacker]}, duration: end_of_turn}
  - id: T037
    name: 試験用慎重兵
    types: [creature]
    civs: [nature]
    cost: 2
    power: 2000
    races: [テスト]
    text: このターン中に自分のクリーチャーが２体以上バトルゾーンに出ていなければ、このクリーチャーは攻撃できない。
    abilities:
      - kind: static
        affects: self
        if: {cmp: [{entered: {owner: you}}, "<", 2]}
        mod: {deny: [attack_player, attack_creature]}

  # ---- 語彙パイロット第6弾（2026-10-30）: opt_reduce の支払い時アクション（summon_time_cost） ----
  - id: T038
    name: 試験用披露兵
    types: [creature]
    civs: [fire]
    cost: 5
    power: 4000
    races: [テスト]
    text: このクリーチャーを召喚する時、自分の手札から進化クリーチャーを１体相手に見せてもよい。そうしたら、このクリーチャーの召喚コストを２少なくする。ただし、コストは０以下にならない。
    abilities:
      - kind: static
        affects: self
        zone: hand
        mod: {opt_reduce: {amount: 2, floor: 0, do: {select: {zone: hand, owner: you, filter: {types: [evolution]}, other: true}, min: 1, max: 1}}}
  - id: T039
    name: 試験用献納兵
    types: [creature]
    civs: [nature]
    cost: 6
    power: 5000
    races: [テスト]
    text: このクリーチャーを召喚する時、自分の手札を１枚捨ててもよい。そうしたら、このクリーチャーの召喚コストを３少なくする。
    abilities:
      - kind: static
        affects: self
        zone: hand
        mod: {opt_reduce: {amount: 3, floor: 0, do: {select: {zone: hand, owner: you, other: true}, min: 1, max: 1, move_to: graveyard}}}
  - id: T040
    name: 試験用回収兵
    types: [creature]
    civs: [water]
    cost: 7
    power: 6000
    races: [テスト]
    text: このクリーチャーを召喚する時、自分の墓地にある呪文を好きな数、山札に加えてシャッフルしてもよい。こうして山札に加えた呪文１枚につき、このクリーチャーの召喚コストを１少なくする。ただし、コストは１より少なくならない。
    abilities:
      - kind: static
        affects: self
        zone: hand
        mod: {opt_reduce: {amount: 1, per: true, floor: 1, do: {select: {zone: graveyard, owner: you, filter: {types: [spell]}}, min: 0, max: 99, move_to: deck, shuffle: true}}}

  # ---- 語彙パイロット第7弾（2026-10-31）: 能力の id と ignore_ids（鬼タイム「真上の能力を無視する」） ----
  - id: T041
    name: 試験用変怪
    types: [creature]
    civs: [darkness]
    cost: 2
    power: 3000
    races: [テスト]
    text: このクリーチャーは攻撃できない。鬼タイム：自分と相手のシールドの数が合計６つ以下なら、真上の能力を無視する。
    abilities:
      - kind: static
        id: above
        affects: self
        mod: {deny: [attack_player, attack_creature]}
      - kind: static
        affects: self
        if: {cmp: [{sum: [{count: {zone: shield, owner: you}}, {count: {zone: shield, owner: opp}}]}, "<=", 6]}
        mod: {ignore_ids: [above]}

  # ---- 語彙パイロット第8弾（2026-10-31）: op mekurade ----
  - id: T042
    name: 試験用捲り手
    types: [creature]
    civs: [nature]
    cost: 3
    power: 2000
    races: [テスト]
    text: このクリーチャーが出た時、メクレイド５する。（自分の山札の上から３枚を見る。その中から、コスト５以下のクリーチャーを１体、コストを支払わずに使ってもよい。残りを好きな順序で山札の下に置く）
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: mekurade, filter: {types: [creature]}, cost_le: 5}
  - id: T043
    name: 試験用召喚獣
    types: [creature]
    civs: [nature]
    cost: 4
    power: 3000
    races: [テスト]
    text: このクリーチャーが召喚によって出た時、カードを１枚引く。
    abilities:
      - kind: trigger
        when: {event: summon, subject: self}
        effect:
          - {op: draw, count: 1}

  # ---- 語彙パイロット第9弾（2026-10-31）: mod cost_may（任意・ターン1回のコスト軽減） ----
  - id: T044
    name: 試験用妖精
    types: [creature]
    civs: [nature]
    cost: 2
    power: 1000
    races: [テスト]
    text: 各ターンに１度、自分の光、水、または自然のクリーチャーの召喚コストを１少なくしてもよい。ただし、コストは０以下にはならない。
    abilities:
