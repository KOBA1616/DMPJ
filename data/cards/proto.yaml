                  - [{op: mana_put, select: {zone: deck, owner: you, from_top: 1}}, {op: may, body: [{op: move, select: {zone: mana, owner: you, count: 1}, to: hand, reason: return}]}]
            else:
              - op: modal
                count: 2
                repeat: true
                modes:
                  - [{op: move, select: {zone: deck, owner: you, from_top: 1}, to: shield, reason: charge}]
                  - [{op: draw, count: 2}]
                  - [{op: discard, select: {zone: hand, owner: opp, count: 1, chooser: random}}]
                  - [{op: destroy, select: {zone: bz, owner: opp, filter: {cost_le: 6}, count: 1}}]
                  - [{op: mana_put, select: {zone: deck, owner: you, from_top: 1}}, {op: may, body: [{op: move, select: {zone: mana, owner: you, count: 1}, to: hand, reason: return}]}]
        else:
          - op: modal
            count: 2
            repeat: true
            modes:
              - [{op: move, select: {zone: deck, owner: you, from_top: 1}, to: shield, reason: charge}]
              - [{op: draw, count: 2}]
              - [{op: discard, select: {zone: hand, owner: opp, count: 1, chooser: random}}]
              - [{op: destroy, select: {zone: bz, owner: opp, filter: {cost_le: 6}, count: 1}}]
              - [{op: mana_put, select: {zone: deck, owner: you, from_top: 1}}, {op: may, body: [{op: move, select: {zone: mana, owner: you, count: 1}, to: hand, reason: return}]}]
    text: "次の中から2回選ぶ。同じものを選んでもよい。自分のエレメントにすべての文明が揃っていれば、かわりにすべてを1回ずつ使ってもよい。▶自分の山札の上から1枚をシールド化する。▶カードを2枚引く。▶相手の手札を1枚見ないで選び、捨てさせる。▶相手のコスト6以下のエレメントを1つ選び、破壊する。▶自分の山札の上から1枚目をマナゾーンに置く。その後、カードを1枚、自分のマナゾーンから手札に戻してもよい。（第317弾: all_civilizations_condition 形C。dm26sd1-b005 魔誕と光喜と楽識と炎怒と哀樹の決断型。条件の「自分のエレメント」は総合ルール403.1によりバトルゾーンのエレメントのみを参照する。マナ全文明では成立しない）"
