    races: [テスト]
    mana: 1
    keywords: [double_breaker]
    text: "W・ブレイカー。自分の他のクリーチャーを召喚した時、そのクリーチャーを破壊してもよい。そうしたら、自分の山札の上から1枚目を表向きにする。それが、破壊したクリーチャーと同じ文明を持つクリーチャーなら、バトルゾーンに出す。そうでなければ、自分の手札に加える。（第288弾・形C）"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, reason: summon, subject: {owner: you, other: true, filter: {types: [creature]}}}
        effect:
          - op: may
            body:
              - op: move
                select: {ref: event.subject}
                to: graveyard
                reason: destroy
                as: sac
              - op: if
                cond: {exists: {ref: sac, zone: graveyard}}
                then:
                  - op: choose
                    select: {zone: deck, owner: you, from_top: 1}
                    reveal: true
                    as: top
                  - op: if
                    cond: {exists: {ref: top, filter: {types: [creature], civs: {civs_of: sac}}}}
                    then:
                      - op: move
                        select: {ref: top}
                        to: bz
                        reason: put
                    else:
                      - op: move
                        select: {ref: top}
                        to: hand
                        reason: draw

