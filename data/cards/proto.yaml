        effect:
          - {op: choose, select: {zone: deck, owner: you, from_top: 9, look: true, count: all}, reveal: true, as: pile}
          - {op: may, body: [{op: play_free, select: {ref: pile, filter: {types: [creature], civs: [light], cost_le: 9, cost_ge: 9}, count: 1}}]}
