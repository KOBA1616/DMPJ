    races: [テスト]
    text: D・D・D [ww01]（自分のクリーチャーが攻撃する時、このカードを [ww01] 支払って自分の手札から実行してもよい）。カードを１枚引く。この呪文を「D・D・D」で唱えたなら、もう１枚引く。
    abilities:
      - kind: declare
        zone: hand
        when: {event: attack, subject: {owner: you, filter: {types: [creature]}}}
        effect:
          - op: may
            body:
