# アカシック系デッキの部品（手書き変換。アカシック3は常在型の無償詠唱が必要でエンジン変更待ち）
cards:
- id: dm24ex3-rp3tr6
  name: 森夢龍 フィオナ・フォレスト
  types:
  - creature
  civs:
  - nature
  cost: 7
  power: 7000
  races:
  - ドリームメイト・ドラゴン
  mana: 1
  keywords:
  - double_breaker
  abilities:
  - kind: trigger
    when:
      event: move
      to: bz
      subject: self
    effect:
    - op: may
      body:
      - op: move
        select:
          zone: mana
          owner: you
          filter:
            types:
            - field
          count: 1
        to: bz
        reason: put
  - kind: static
    affects:
      zone: bz
      owner: you
      other: true
      filter:
        race_has: ドリームメイト
    mod:
      deny:
      - be_chosen
  text: 'W・ブレイカー

    このクリーチャーが出た時、フィールドを１枚、自分のマナゾーンから出してもよい。

    相手が自分のクリーチャーを選ぶ時、自分の他のドリームメイトは選ばれない。'
  source:
    official: dm24ex3-rp3tr6
    review: pending
    notes: 手書き変換。『相手が選ぶ時』は be_chosen（相手に選ばれる）の禁止で、自分の他のドリームメイトに常在型で与える
