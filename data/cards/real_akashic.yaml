- id: dmrp07-009
  faces:
  - name: ラルド・ワースピーダ
    types:
    - creature
    civs:
    - nature
    cost: 3
    power: 8000
    races:
    - グランセクト
    keywords:
    - guardman
    - cannot_attack
    - last_burst
    abilities:
    - kind: replace
      optional: true
      when:
        event: move
        to: graveyard
        reason: destroy
        subject:
          owner: you
          filter:
            races:
            - グランセクト
          other: true
      instead:
      - op: destroy
        select:
          ref: self
          count: 1
  - name: H.D.2.
    types:
    - spell
    civs:
    - nature
    cost: 5
    spell:
    - op: modal
      modes:
      - - op: move
          select:
            zone: deck
            owner: you
            from_top: 2
          to: mana
          reason: put
      - - op: move
          select:
            zone: deck
            owner: opp
            from_top: 2
          to: mana
          reason: put
  mana: 1
  text: 'ラルド・ワースピーダ: ガードマン / 攻撃できない / セイバー：グランセクト / ラスト・バースト ／ H.D.2.: プレイヤーを１人選ぶ。そのプレイヤーは、自身の山札の上から２枚をマナゾーンに置く。'
  source:
    official: dmrp07-009
    review: pending
    notes: 手書き変換（ツインパクト）。『プレイヤーを1人選ぶ』は modal で自分/相手を選ぶ形。セイバーは dm20-038 と同じ置換
