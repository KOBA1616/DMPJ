  - id: dm26ex1-018
    name: 邪魂龍 ジャビビルブラッド
    types:
    - creature
    civs:
    - darkness
    cost: 4
    mana: 1
    text: 'ブロッカー

      自分の墓地から出たクリーチャーはすべて、出たターンに相手プレイヤーを攻撃できる。

      ハイパー化：自分の他のクリーチャーを１体タップする。（自分のメインステップ中に、ハイパーモードを解放できる。ハイパーモードは次の自分のターンのはじめまで続く）'
    power: 4000
    races:
    - アビスドラゴン
    - 超化獣
    keywords:
    - blocker
    hyper: true
    abilities:
    - kind: static
      affects:
        owner: you
        zone: bz
        filter:
          types:
          - creature
          entered_from: graveyard
          entered_this_turn: true
      mod:
        player_rush: true
    - kind: static
      affects: self
      mod:
        power: 6000
      if:
        hyper: true
    - kind: static
      affects: self
      mod:
        grant:
        - double_breaker
      if:
        hyper: true
    - kind: trigger
      first_time: true
      when:
        event: attack
        subject:
          owner: you
          filter:
            race_has: アビス
      if:
        hyper: true
      effect:
      - op: move
        select:
          zone: deck
          owner: you
          count: 2
          from_top: 2
        to: graveyard
        reason: put
      - op: may
        body:
        - op: move
          select:
            zone: graveyard
            owner: you
            count: 1
            filter:
              types:
              - creature
              race_has: アビス
              cost_le: 3
          to: bz
          reason: put
    source:
      official: dm26ex1-018
      review: pending
      notes: 'ハイパー面（raw faces[1]）のパワー差分は {hyper: true} 条件の power 修整、ハイパー時だけの能力・キーワードは {hyper: true} 条件で表現。期限は文面どおり（次の自分のターンのはじめまで）。「自分の墓地から出たクリーチャーは出たターンにプレイヤーを攻撃できる」は player_rush を墓地から出たクリーチャー（filter entered_from: graveyard）に与える常在で表した。'
      unsupported: []
      aliases:
      - dm24ex3-rp2s06
      - dm24ex3-rp2sec04
      - dm24rp2-s06
      - dm24rp2-sec04
      - promoy24-095
