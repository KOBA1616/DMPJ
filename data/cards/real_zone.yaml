  - id: dm23-035
    name: 曲芸メイド・リン・ララバイ
    types: [creature]
    civs: [nature]
    cost: 4
    power: 1000
    races: [ドリームメイト]
    text: "このクリーチャーをバトルゾーンに出した時、各プレイヤーは自分自身の山札の上から１枚目を、それぞれのマナゾーンに置く。 / L・ゲート：ドリームメイト(このクリーチャーが破壊される時、墓地に置くかわりに、ドリームメイトを１体、自分の墓地から手札に戻してもよい。そうした場合、このクリーチャーを山札の一番下に置く)"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: mana_put, select: {zone: deck, owner: you, from_top: 1}}
          - {op: mana_put, select: {zone: deck, owner: opp, from_top: 1}}
      - kind: replace
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        if: {exists: {zone: graveyard, owner: you, filter: {races: [ドリームメイト]}}}
        optional: true
        instead:
          - {op: move, select: {zone: graveyard, owner: you, filter: {races: [ドリームメイト]}, count: 1}, to: hand, reason: return}
          - {op: move, select: {ref: event.subject}, to: deck, reason: put, position: bottom}
    source: {official: dm23-035, review: pending, notes: "両プレイヤーの山札が減る（山札切れ戦略の部品）。L・ゲートは置換で表現（墓地のドリームメイトを手札に戻し、自身を山札の底へ）。races は完全一致の種族名なのでドリームメイト単独の種族のみ対象"}

