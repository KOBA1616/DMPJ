  - id: dm20-033
    name: ザッピング・ビーンズ
    types: [creature]
    civs: [nature]
    cost: 5
    power: 4000
    races: [ワイルド・ベジーズ]
    text: "このクリーチャーをバトルゾーンに出した時、相手はバトルゾーンにある自分自身のクリーチャーを１体選び、持ち主のマナゾーンに置く。 / このクリーチャーが破壊された時、相手は進化ではないクリーチャーを１体、自分自身のマナゾーンから選び、バトルゾーンに出す。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: mana_put, select: {zone: bz, owner: opp, chooser: opp, filter: {types: [creature]}, count: 1}}
      - kind: trigger
        when: {event: move, from: bz, to: graveyard, reason: destroy, subject: self}
        effect:
          - {op: move, select: {zone: mana, owner: opp, chooser: opp, filter: {types: [creature], not_types: [evolution]}, count: 1}, to: bz, reason: put}
    source: {official: dm20-033, review: pending, notes: "相手の盤面→マナ→盤面の往復を作る（相手が得をする側のデメリット付き効果）。マナに置かれたカードの数・踏み倒しの連鎖で封魔フォラス等と衝突する"}

  - id: dm20-008
    name: スローリー・チェーン
    types: [spell]
    civs: [light]
    cost: 4
    keywords: [s_trigger]
    resolve_to: shield
    text: "S・トリガー このターン、クリーチャーは攻撃することができない。 この呪文を裏向きにしてシールドに加える。その後、自分のシールドを１枚選び、墓地に置く。"
    spell:
      - op: modify
        select: {zone: bz, owner: any, filter: {types: [creature]}, count: all}
        dynamic: true
        mod: {deny: [attack_player, attack_creature]}
        duration: end_of_turn
      - {op: move, select: {ref: self}, to: shield, reason: put}
      - {op: move, select: {zone: shield, owner: you, count: 1}, to: graveyard, reason: put}
    source: {official: dm20-008, review: pending, notes: "手札/シールド→シールド→墓地。呪文自身がシールドに加わった後に、シールド1枚（自分自身を含む）を墓地へ。「このターン、クリーチャーは攻撃できない」は後から出たクリーチャーにも及ぶ（dynamic）"}

  - id: dm20-029
    name: 怨念集結
    types: [spell]
    civs: [darkness]
    cost: 4
    keywords: [s_trigger]
    text: "S・トリガー 自分の墓地にあるカードの枚数と、コストが同じかそれ以下の相手のクリーチャーを１体破壊する。"
