# 実カード（ゾーン間移動系）。公式カード詳細ページのテキストを効果DSLに変換したもの（review: pending）。
# 原文は data/cards/raw/official_20261024d.jsonl。選定の観点は docs/card-selection.md。
# 追加した語彙: カード側 free_if（G・ゼロ: 条件を満たすとコストを支払わずに召喚できる）、
#   when の unpaid（「マナゾーンのカードをタップせずに」召喚/詠唱した時）。
cards:
  - id: dm20-027
    name: 封魔フォラス
    types: [creature]
    civs: [darkness]
    cost: 5
    power: 9000
    races: [グランド・デビル]
    keywords: [double_breaker]
    text: "自分の他のクリーチャーをバトルゾーンに出した時、そのクリーチャーを破壊する。 / 自分のマナゾーンにカードを置いた時、そのカードを墓地に置く。 / W・ブレイカー"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: {owner: you, other: true}}
        effect:
          - {op: destroy, select: {ref: event.subject}}
      - kind: trigger
        when: {event: move, to: mana, subject: {owner: you}}
        effect:
          - {op: move, select: {ref: event.subject}, to: graveyard, reason: put}
    source: {official: dm20-027, review: pending, notes: "ゾーン変換の核: 出したクリーチャーが破壊される／マナに置いたカードが墓地へ行く（墓地肥やし）。「出した時」は召喚・踏み倒し・墓地やマナからの登場すべて（move to bz）で誘発する"}

  - id: dm20-011
    name: 黒神龍ヴァイザス
    types: [creature]
    civs: [darkness]
    cost: 5
    power: 6000
    races: [ドラゴン・ゾンビ]
    keywords: [double_breaker]
    text: "このクリーチャーが攻撃する時、自分のシールドを１枚選び、手札に加える。ただし、その「S・トリガー」は使えない。 / W・ブレイカー"
    abilities:
      - kind: trigger
        when: {event: attack, subject: self}
        effect:
          - {op: move, select: {zone: shield, owner: you, count: 1}, to: hand, reason: return}
    source: {official: dm20-011, review: pending, notes: "シールド→手札。S・トリガーを使えない扱いは reason: return（コダマダンス・チャージャーと同じ）"}

  - id: dm20-013
    name: 百発人形マグナム
    types: [creature]
    civs: [darkness]
    cost: 4
    power: 4000
    races: [デスパペット]
    text: "マナゾーンのカードをタップせずに、誰かがクリーチャーまたはクロスギアをバトルゾーンに出した時または呪文を唱えた時、そのプレイヤーは自分自身のクリーチャーを１体選んで破壊する。"
    abilities:
      - &mag_summon_you
        kind: trigger
        when: {event: move, to: bz, unpaid: true, subject: {owner: you, filter: {types: [creature]}}}
        effect:
          - {op: destroy, select: {zone: bz, owner: you, filter: {types: [creature]}, count: 1}}
      - &mag_summon_opp
        kind: trigger
        when: {event: move, to: bz, unpaid: true, subject: {owner: opp, filter: {types: [creature]}}}
        effect:
          - {op: destroy, select: {zone: bz, owner: opp, chooser: opp, filter: {types: [creature]}, count: 1}}
      - &mag_cast_you
        kind: trigger
        when: {event: cast, unpaid: true, player: you}
        effect:
          - {op: destroy, select: {zone: bz, owner: you, filter: {types: [creature]}, count: 1}}
      - &mag_cast_opp
        kind: trigger
        when: {event: cast, unpaid: true, player: opp}
        effect:
          - {op: destroy, select: {zone: bz, owner: opp, chooser: opp, filter: {types: [creature]}, count: 1}}
    source: {official: dm20-013, review: pending, notes: "「クロスギア」は未対応（クロスギアはモデルに無い）。タップせずに=コストを支払わずに実行（unpaid）として扱う。出す側は move（to: bz）で受け、召喚（G・ゼロ・踏み倒し）だけでなく効果で「出す」（墓地から出す等の reason: put）でも誘発する。自分が踏み倒すと自分のクリーチャーが破壊される（盗掘人形モールス等とのループ・縛りの部品）"}

  - id: dm16-027
    name: 盗掘人形モールス
    types: [creature]
    civs: [darkness]
    cost: 5
    power: 2000
    races: [デスパペット]
    free_if: {cmp: [{count: {zone: graveyard, owner: you, filter: {types: [creature]}}}, ">=", 6]}
    text: "G・ゼロ-自分の墓地にクリーチャーが６体以上あれば、このクリーチャーをコストを支払わずに召喚してもよい。 このクリーチャーをバトルゾーンに出した時、クリーチャーを１体、自分の墓地から自分の手札に戻してもよい。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - op: may
            body:
              - {op: move, select: {zone: graveyard, owner: you, filter: {types: [creature]}, count: 1}, to: hand, reason: return}
    source: {official: dm16-027, review: pending, notes: "G・ゼロはカード側の free_if で表現（メインステップの選択肢に :free が増える）。マグナムと組むと踏み倒しのたびにクリーチャーを破壊→墓地が増える"}

  - id: dm20-018
    name: 緑神龍ミルドガルムス
    types: [creature]
    civs: [nature]
    cost: 7
    power: 5000
    races: [アース・ドラゴン]
    text: "このクリーチャーをバトルゾーンに出した時、相手のマナゾーンからカードを１枚選び、持ち主の墓地に置く。その後、自分の山札の上から１枚目を自分のマナゾーンに置く。"
    abilities:
      - kind: trigger
        when: {event: move, to: bz, subject: self}
        effect:
          - {op: move, select: {zone: mana, owner: opp, count: 1}, to: graveyard, reason: put}
          - {op: mana_put, select: {zone: deck, owner: you, from_top: 1}}
    source: {official: dm20-018, review: pending, notes: "相手マナ→墓地、自分の山札→マナ。ターンをまたぐロック（マナ破壊）と山札の消費の部品"}

  - id: dm20-020
    name: 偉大なる恵み
    types: [spell]
    civs: [nature]
    cost: 4
    keywords: [s_trigger]
    text: "S・トリガー  クリーチャーを３体まで、自分の墓地からマナゾーンに置く。"
    spell:
      - op: mana_put
        select: {zone: graveyard, owner: you, filter: {types: [creature]}, count: 3, up_to: true}
