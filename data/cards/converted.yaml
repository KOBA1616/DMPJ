    - アーマード・ドラゴン
    - ファイアー・バード
  text: '究極進化—自分の進化アーマード・ドラゴンまたは進化ファイアー・バード１体の上に置く。

    このクリーチャーをバトルゾーンに出した時、相手は自身のパワーが一番小さいクリーチャーを選んで破壊する。

    ゴッドスレイヤー（このクリーチャーがゴッドとバトルする時、バトルの後、そのゴッドを破壊する）

    T・ブレイカー

    このクリーチャーが破壊された時、相手は自身のパワーが一番小さいクリーチャーを選んで破壊する。その後、自分のパワーが一番小さいクリーチャーを破壊する。その後、進化ではないドラゴンを１体、自分の墓地からバトルゾーンに出してもよい。'
  abilities:
  - kind: trigger
    when:
      event: move
      to: bz
      subject: self
    effect:
    - op: destroy
      select:
        zone: bz
        owner: opp
        filter:
          types:
          - creature
        count: 1
        chooser: opp
  - kind: trigger
    when:
      event: move
      from: bz
      to: graveyard
      reason: destroy
      subject: self
    effect:
    - op: destroy
      select:
        zone: bz
        owner: opp
        filter:
          types:
          - creature
        count: 1
        chooser: opp
    - op: destroy
      select:
        zone: bz
        owner: you
        filter:
          types:
          - creature
        count: 1
    - op: move
      select:
        zone: graveyard
        owner: you
        filter:
          types:
          - creature
          not_types:
          - evolution
          race_has: ドラゴン
        count: 1
        up_to: true
      to: bz
      reason: put
  source:
    official: 33-sec001
    review: pending
    notes: 「パワーが一番小さいクリーチャーを選んで破壊する」は、最小パワーを指定する語彙が無いため、対象のプレイヤーが自分のクリーチャーから1体選んで破壊する形に近似した（unsupported
      参照）。ゴッドスレイヤーは対応するキーワードが無いため能力として書いていない（unsupported 参照）
    unsupported:
    - need: god_slayer
      text: ゴッドスレイヤー
    - need: select_min_power
      text: このクリーチャーをバトルゾーンに出した時、相手は自身のパワーが一番小さいクリーチャーを選んで破壊する。
    - need: select_min_power
      text: このクリーチャーが破壊された時、相手は自身のパワーが一番小さいクリーチャーを選んで破壊する。その後、自分のパワーが一番小さいクリーチャーを破壊する。
  keywords:
  - triple_breaker
