- id: 28-sec001
  name: 不滅の精霊パーフェクト・ギャラクシー
  types:
  - creature
  civs:
  - light
  cost: 7
  power: 9000
  races:
  - エンジェル・コマンド
  text: 'シールド・フォース（このクリーチャーをバトルゾーンに出す時、自分のシールドを１枚選んでもよい。そのシールドがシールドゾーンにある間、このクリーチャーは次の
    l 能力を得る）

    l このクリーチャーは「ブロッカー」を得る。

    l このクリーチャーがバトルゾーンを離れる時、バトルゾーンから離れずにとどまる。

    W・ブレイカー（このクリーチャーはシールドを２枚ブレイクする）'
  abilities:
  - kind: trigger
    when:
      event: move
      to: bz
      subject: self
    effect:
    - op: may
      body:
      - op: choose
        select:
          zone: shield
          owner: you
          count: 1
        as: target
      - op: mark
        name: sf_shield
  - kind: static
    if:
      marked: sf_shield
    affects: self
    mod:
      grant:
      - blocker
  - kind: replace
    when:
      event: move
      from: bz
      subject: self
    if:
      marked: sf_shield
    instead: []
  source:
    official: 28-sec001
    review: pending
    notes: シールド・フォース（バトルゾーンに出す時にシールドを1枚指定し、そのシールドがシールドゾーンを離れるまで有効）は完全には再現できないため、出た時の誘発でシールドを選んで自身にマークを付与する処理で近似。指定したシールドが離れた時に能力を失う処理は未実装。
    unsupported:
    - need: shield_force
      text: シールド・フォース
  keywords:
  - double_breaker
- id: 28-sec002
  name: 邪眼皇ロマノフI世
  types:
  - creature
  civs:
  - darkness
  cost: 7
  power: 8000
  races:
  - ダークロード
  - ドラゴン・ゾンビ
  - ナイト
  mana: 1
  text: 'このクリーチャーをバトルゾーンに出した時、自分の山札を見る。その中から闇のカードを１枚選び、自分の墓地に置いてもよい。その後、山札をシャッフルする。

    このクリーチャーが攻撃する時、自分の墓地にある闇のコストが６以下の呪文を１枚、コストを支払わずに唱えてもよい。その後、その呪文を自分の山札の一番下に置く。

    W・ブレイカー（このクリーチャーはシールドを２枚ブレイクする）'
  abilities:
  - kind: trigger
    when:
      event: move
      to: bz
      subject: self
    effect:
    - op: move
      select:
        zone: deck
        owner: you
        filter:
          civs:
          - darkness
        count: 1
        up_to: true
        look: true
      to: graveyard
      reason: put
    - op: shuffle
      player: you
  - kind: trigger
    when:
      event: attack
      subject: self
    effect:
    - op: play_free
      select:
        zone: graveyard
        owner: you
        filter:
          civs:
          - darkness
          types:
          - spell
          cost_le: 6
        count: 1
        up_to: true
      resolve_to: deck
  source:
    official: 28-sec002
    review: pending
    notes: '唱えた呪文を山札の一番下に置く処理は play_free の resolve_to: deck で表現（位置の指定はエンジンの解決処理に委ねる）'
  keywords:
  - double_breaker
