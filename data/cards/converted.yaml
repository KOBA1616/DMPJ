- id: 24-s010
  name: ボルメテウス・武者・ドラゴン
  types:
  - creature
  civs:
  - fire
  cost: 6
  power: 6000
  races:
  - アーマード・ドラゴン
  keywords:
  - double_breaker
  text: Ｗ・ブレイカー / このクリーチャーが攻撃する時、自分のシールドを１枚、墓地に置いてもよい。そうした場合、相手のパワー6000以下のクリーチャーを１体破壊する。
  abilities:
  - kind: trigger
    when:
      event: attack
      subject: self
    effect:
    - op: may
      body:
      - op: move
        select:
          zone: shield
          owner: you
          count: 1
        to: graveyard
        reason: put
        as: paid
      - op: if
        cond:
          exists:
            ref: paid
        then:
        - op: destroy
          select:
            zone: bz
            owner: opp
            filter:
              types:
              - creature
              power_le: 6000
            count: 1
  source:
    official: 24-s010
    review: pending
