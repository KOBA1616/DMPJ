- id: 26-s002
  name: ボルシャック・大和・ドラゴン
  types:
  - creature
  civs:
  - fire
  cost: 6
  power: 6000
  races:
  - アーマード・ドラゴン
  keywords:
  - speed_attacker
  - double_breaker
  text: スピードアタッカー / 攻撃中、このクリーチャーのパワーは、自分の墓地にある火のカード１枚につき+1000される。 / Ｗ・ブレイカー / 《ボルメテウス・武者・ドラゴン》の能力によって、相手のパワー6000以下のクリーチャーを１体破壊する時、かわりに相手のパワー12000以下のクリーチャーを１体破壊する。
  source:
    official: 26-s002
    review: pending
    notes: 墓地の火のカード数に応じた攻撃中のパワー増加能力（1枚につき+1000）はmod.powerが数値固定のためDSLで直接表現不可。《ボルメテウス・武者・ドラゴン》の能力による破壊上限を増やす置換効果はDSL未対応。
    unsupported:
    - need: dynamic_power_modifier
      text: 攻撃中、このクリーチャーのパワーは、自分の墓地にある火のカード１枚につき+1000される。
    - need: replace_effect_target_modifier
      text: 《ボルメテウス・武者・ドラゴン》の能力によって、相手のパワー6000以下のクリーチャーを１体破壊する時、かわりに相手のパワー12000以下のクリーチャーを１体破壊する。
- id: 26-s003
  name: 聖鎧亜キング・アルカディアス
  types:
  - creature
  - evolution
  civs:
  - light
  - darkness
  cost: 7
  power: 9000
  races:
  - エンジェル・コマンド
  - ロスト・クルセイダー
  keywords:
  - double_breaker
  evolve_from:
    multicolor: true
  text: マナゾーンに置く時、このカードはタップして置く。 / 進化—自分の多色クリーチャー１体の上に置く。 / Ｗ・ブレイカー / 相手は多色以外のクリーチャーをバトルゾーンに出す時、バトルゾーンに出すかわりに墓地に置く。
  abilities:
