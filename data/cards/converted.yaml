    メテオバーン - このクリーチャーがこのターンはじめて攻撃する時、このクリーチャーの下にあるカードを２枚まで選び墓地に置いてもよい。このようにしてドラゴンを墓地に置いた場合、このクリーチャーをアンタップする。このようにしてエンジェル・コマンドを墓地に置いた場合は、このクリーチャーがこのターン中破壊される時、バトルゾーンにとどまる。T・ブレイカー'
  abilities:
  - kind: trigger
    when:
      event: attack
      subject: self
    if:
      not:
        marked: shiden_meteor_burn
    effect:
    - op: mark
      name: shiden_meteor_burn
    - op: may
      body:
      - op: move
        select:
          under_of: self
          count: 2
          up_to: true
        to: graveyard
        reason: put
        as: burned
      - op: if
        cond:
          exists:
            ref: burned
            filter:
              race_has: ドラゴン
        then:
        - op: untap
          select:
            ref: self
      - op: if
        cond:
          exists:
            ref: burned
            filter:
              races:
              - エンジェル・コマンド
        then:
        - op: modify
          select:
            ref: self
          duration: end_of_turn
          mod:
            gain:
            - kind: replace
              when:
                event: move
                from: bz
                to: graveyard
                reason: destroy
                subject: self
              instead: []
  source:
    official: 31-sec001
    review: pending
    notes: '進化V（ドラゴンまたはエンジェル・コマンドのいずれか2体を進化元にする）は、進化元の数と「または」の条件を表す語彙が無いため evolve_from
      は制限なしの近似にし、unsupported に残した（要確認）。メテオバーンの「このターンはじめて」は mark で判定（印はカード個別ではない）。「破壊される時、バトルゾーンにとどまる」は
      instead: []（何もしない置換）で表した。要確認'
    unsupported:
    - need: vortex_evolution
      text: 進化V-自分のドラゴンまたはエンジェル・コマンドのいずれか２体を重ねた上に置く。
  keywords:
  - triple_breaker
