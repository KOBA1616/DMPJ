# 新しい入口（ループの最小パーツ、2026-11-14 ユーザー定義）への経路。シャコガイル・ドラゲリオンは勝ち手段で、入口の後（物差しの段2）で見る。
name: saga_v3
via: 墓地にクリーチャーを貯め、サガを2枚（手札に1枚、もう1枚は手札か墓地）そろえる
stages:
  - name: 墓地のクリーチャーが2体以上
    weight: 60
    all:
      - {zone: graveyard, match: {types: [creature]}, n: 2}
  - name: 墓地のクリーチャー2体以上、手札にサガ、サガが手札と墓地に合わせて2枚
    weight: 150
    all:
      - {zone: graveyard, match: {types: [creature]}, n: 2}
      - {zone: hand, match: {name: dm22ex2-021}, n: 1}
      - {zones: [hand, graveyard], match: {name: dm22ex2-021}, n: 2}
  - name: 入口
    weight: 300
    entry: saga
  # 入口の後（勝ちへの変換、物差しの段2）。ユーザー指摘（2026-11-14）: サガの効果で墓地のイザナギテラス（オリジン・コスト4）を出し、
  # その効果でコダマダンス・チャージャーを唱え、チャージャーで闇マナを1枚増やす。墓地のクリーチャーを進化元にドラゲリオンを出し、
  # 次のターンの攻撃（メテオバーン）で墓地のシャコガイルを出し、山札の最後の1枚で勝つ。
  - name: 入口に加え、手札にドラゲリオンとコダマダンス・チャージャー、墓地にイザナギテラス
    weight: 350
    entry: saga   # 入口の述語も含める（含めないと入口を飛ばして点を取れ、入口到達が 14→6 に下がった、2026-11-14）
    all:
      - {zone: hand, match: {name: dm22ex1-007}, n: 1}
      - {zones: [hand, mana], match: {name: dmex10-020}, n: 1}   # チャージャーは唱えるとマナに置かれる（そこが使った後の場所）。手札だけを指すと唱えると点が減り、13局で唱えられるのに唱えなかった（2026-11-17 診断）
      - {zone: graveyard, match: {name: dm22ex1-025}, n: 1}
      - {zone: hand, match: {name: dm22ex2-021}, n: 1}
  - name: ドラゲリオンが場
    weight: 400
    all:
      - {zone: bz, match: {name: dm22ex1-007}, n: 1}
  - name: シャコガイルが場に出ている（進化元でない）
    weight: 500
    all:
      - {zone: bz, match: {name: dmrp03-s03}, n: 1, top: true}
