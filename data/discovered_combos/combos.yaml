# counted: true = koba が新規コンボとして数えてよいと決めたもの。
combos:
  - id: akashic_hd2
    name: アカシック H.D.2. 短縮ループ
    counted: true
    decided: "2026-11-13 koba（PR #409 のループを新規コンボに追加してよい）"
    found: "2026-11-13 PR #409。陽性対照のランダム組（ウォカンナ／ナウ・オア・ネバー差し替え）が勝ち続ける理由を手順で追って判明。人が手順を与えずに探索が自分で選んだループ（docs/combo-ruler-design.md §13 の L2）"
    type: [loop]          # 設計書 §11 の類型。山札切れ勝ち
    parts:
      - {id: dm23ex2-009, name: 完全水中要塞 アカシック3, zone: bz, n: 1, role: core}
      - {id: dm23bd7-035, name: 魔刻の斬将オルゼキア／訪れる魔の時刻, zone: hand, n: 2, role: core}
      - {id: dmrp07-009, name: ラルド・ワースピーダ／H.D.2., zone: hand, n: 1, role: core}   # 勝ち手段も兼ねる
    procedure:
      - アカシック3 の「呪文をコストを支払わずに唱えてもよい」で H.D.2. を相手を選んで唱える（相手の山札の上2枚を相手のマナへ）。H.D.2. は墓地へ。
      - 訪れる魔の時刻Aを無償で唱え、墓地のラルド（H.D.2.）と、前の周で墓地に行った訪れる魔の時刻B（オルゼキア＝クリーチャー）を手札へ。
      - H.D.2. → 訪れる魔の時刻B（Aとラルドを回収）… を繰り返す。1周で相手の山札 −2、相手のマナ +2。自分の山札は減らない。
    known_variant_of: akashic   # 既知のアカシック（ナウ・オア・ネバー＋ウォカンナ）より部品が2種類少ない
    entry: data/loops/entry/akashic_hd2.json   # PR #411 で陽性対照（ruler_control.KNOWN）の既知の別版としても使用
    ruler:   # dmsim/eval/ruler.py judge、ruler_control.run_one（入口をシードで変える、#411 の入口局面）、自分1ターン（max_turn 2）、budget 1500、8シード
      measured: "2026-11-13"
      real_deck:  {stage1: 5/8, stage2: 5/8, via: loop, win_turn: 1, certificate: 無限}
      without_l1: {stage1: 8/8, stage2: 8/8, via: loop, win_turn: 1, certificate: 無限, note: "ナウ・オア・ネバー→dm01-060、ウォカンナ→dm01-063 に差し替えたデッキ"}
      misses: "実デッキで外れた seed 5/6/7 はどれも配り直した手札にナウ・オア・ネバーが入った局面。budget 3000 でも seed 5 はループ無し、seed 6 は有限5周で勝てず。札が増えて探索が L2 を選び切れない探索側の問題で、カードの組としては成立（差し替えデッキで 8/8）"
    status: 成立（カードデータ・エンジン上。2026-11-13 公式取得テキストと総合ルールで照合済み）
    checked:   # 2026-11-13、data/cards/raw の公式取得テキストと総合ルール v1.53 で照合（DMO は不使用）
      - "アカシック3（dm23ex2-009、再録 dm25ex2-cho005 も同文）の原文は「自分は呪文をコストを支払わずに唱えてもよい。」の1文だけ（欠け・途切れなし）。回数・ターン・コスト・対象の条件は無い。データは手札から唱える呪文に限っているが、ループは手札から唱えるので影響なし"
      - "H.D.2. 原文「プレイヤーを１人選ぶ。そのプレイヤーは、自身の山札の上から２枚をマナゾーンに置く。」とデータ（modal 自分／相手）は一致"
      - "訪れる魔の時刻 原文「好きな数のクリーチャーを、自分の墓地から手札に戻す。」とデータ（墓地のクリーチャーを any 枚手札へ）は一致"
      - "ツインパクトは墓地でも両方のカードタイプを持ち、クリーチャーとして参照できる（810.1・810.3・810.3a）。唱えた呪文は解決の最後に墓地へ（605.2f）。エンジンの挙動は tests/test_discovered_combos.py の1周テストで確認"
