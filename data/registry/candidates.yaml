# 登録簿への候補（tools/registry.py が dmsim/eval/verify.py の検証に通して data/registry/combos.yaml へ書く）。
# 元: data/known_combos/combos.yaml（tuning / holdout）と data/discovered_combos/combos.yaml（discovered）。どちらも形は変えない。
# core は既知コンボの parts の role: core と同じ札（新規性判定 registry.novelty と区分の重なり検査の対象）。
# holdout の候補は検証（purpose=eval）だけに通し、照会 query(for_tuning=True) には出さない。
candidates:
  - id: saga
    name: 絶望神サガの蘇生ループ
    split: tuning
    types: [loop]
    contribution_2b:   # 組の寄与（中核をつなぎ札に置換した対照との同一シード差、相手 2b・4T終わり・40局、2026-11-14 tools/attack_screen.py known）。足切りに使わない
      core_removed: ["dm22ex2-021"]
      kill: {"diff": 0.0, "ci95": [0.0, 0.0], "better": 0, "worse": 0}
      left: {"diff": 0.0, "ci95": [-0.0992, 0.0992], "better": 2, "worse": 2}
      broken: {"diff": 0.0, "ci95": [-0.0992, 0.0992], "better": 2, "worse": 2}
      board: {"diff": 0.45, "ci95": [0.2521, 0.6479], "better": 15, "worse": 0}
    win: effect           # シャコガイル（山札の最後の1枚を引いて勝つ）
    entry: data/loops/entry/saga_v1.json   # 旧い入口（誤った定義、§23）。段2が直ったら新しい入口へ
    core:
      - {id: dm22ex2-021, name: 絶望神サガ, role: エンジン（蘇生）, part: loop}
      - {id: dmrp03-s03, name: 水上第九院 シャコガイル, role: 勝ち手段, part: win}
      - {id: dm22ex1-007, name: 超神星DOOM・ドラゲリオン, role: 変換（墓地進化でシャコガイルを出す）, part: win}
    procedure:
      - ループ：手札のサガを3マナで出し、墓地のサガとの蘇生で1周1枚引いて1枚捨てる。勝ちへの変換：山札のシャコガイルを場に出し（ドラゲリオンの墓地進化・メテオバーン）、山札の最後の1枚を引いてシャコガイルの効果で勝つ。
  - id: knight_dmc
    name: ～地獄帰りの騎士～＋DARK MEMORY CONTAINER
    split: tuning
    types: [resource]
    contribution_2b:   # 組の寄与（中核をつなぎ札に置換した対照との同一シード差、相手 2b・4T終わり・40局、2026-11-14 tools/attack_screen.py known）。足切りに使わない
      core_removed: ["dm25ex3-028", "dm25ex3-055"]
      kill: {"diff": 0.0, "ci95": [0.0, 0.0], "better": 0, "worse": 0}
      left: {"diff": 0.225, "ci95": [0.0939, 0.3561], "better": 9, "worse": 0}
      broken: {"diff": 0.225, "ci95": [0.0939, 0.3561], "better": 9, "worse": 0}
      board: {"diff": 0.275, "ci95": [0.0221, 0.5279], "better": 13, "worse": 4}
    win: beat
    core:
      - {id: dm25ex3-028, name: ～地獄帰りの騎士～, role: エンジン}
      - {id: dm25ex3-055, name: DARK MEMORY CONTAINER, role: エンジン}
    setup: data/registry/setups/knight_dmc.json
    procedure:
      - 盾が置かれた時に墓地から騎士が出る。3マナで体3つと手札を得る（リソース型、設計書 §11）。
  - id: akashic
    name: アカシック ナウ・オア・ネバー＋ウォカンナ
    split: tuning
    types: [loop]
    contribution_2b:   # 組の寄与（中核をつなぎ札に置換した対照との同一シード差、相手 2b・4T終わり・40局、2026-11-14 tools/attack_screen.py known）。足切りに使わない
      core_removed: ["dm23ex2-009", "dm23bd7-035"]
      kill: {"diff": 0.0, "ci95": [0.0, 0.0], "better": 0, "worse": 0}
      left: {"diff": 0.05, "ci95": [-0.0705, 0.1705], "better": 2, "worse": 1}
      broken: {"diff": 0.05, "ci95": [-0.0705, 0.1705], "better": 2, "worse": 1}
      board: {"diff": 0.075, "ci95": [-0.1157, 0.2657], "better": 6, "worse": 3}
    win: opp_deck_out
    entry: data/loops/entry/akashic_v1.json   # 旧い入口（誤った定義、§23）。段2が直ったら新しい入口へ
    core:
      - {id: dm23ex2-009, name: 完全水中要塞 アカシック3, role: エンジン（呪文の無償詠唱）}
      - {id: dm23bd7-035, name: 魔刻の斬将オルゼキア／訪れる魔の時刻, role: 回収}
      - {id: dmrp12-s01, name: 天命龍装 ホーリーエンド／ナウ・オア・ネバー, role: 勝ち手段, part: win}
      - {id: dm24ex1-038, name: 冥土人形ウォカンナ・ピエール, role: 勝ち手段, part: win}
  - id: akashic_hd2
    name: アカシック H.D.2. 短縮ループ
    split: discovered
    types: [loop]
    win: opp_deck_out
    entry: data/loops/entry/akashic_hd2_v1.json   # 旧い入口（誤った定義、§23）。段2が直ったら新しい入口へ
    core:
      - {id: dm23ex2-009, name: 完全水中要塞 アカシック3, role: エンジン（呪文の無償詠唱）}
      - {id: dm23bd7-035, name: 魔刻の斬将オルゼキア／訪れる魔の時刻, role: 回収}
      - {id: dmrp07-009, name: ラルド・ワースピーダ／H.D.2., role: 勝ち手段, part: win}
    procedure:
      - アカシック3 で H.D.2. を相手に向けて無償で唱え（相手の山札の上2枚をマナへ）、訪れる魔の時刻で墓地のラルドともう1枚の訪れる魔の時刻を回収、を繰り返す。
  - id: drill_lock
    name: ドリルスコール＋ジョバンニ＋クルト
    split: holdout
    types: [lock]
    win: lock
    lock_mode: active
    core:
      - {id: dm16-051, name: ドリル・スコール, role: ロック}   # 旧候補は名前の「・」抜けと id 未記入で引き当てられなかった
      - {id: dm36-015, name: 天雷王機ジョバンニX世, role: 回収}
      - {id: dm36-078, name: クルトの気合釣り, role: 山札の回復}
    setup: data/registry/setups/drill_lock.json
    # 与えた方針（優先順）: マナ置き用の札をチャージ（光→火）→ ドリル・スコール → クルト（墓地のドリルを山札の上へ）→
    # ドリルで自分のマナから捨てるのはマナ置き用（光→火）→ ジョバンニで墓地のクルト・ドリルを手札へ。コンボの札はチャージしない
    policy: ["charge:dm02-038", "charge:dm01-042", "charge:dm01-072", "charge:dm01-077", "charge:dm01-075", "charge:dm01-033", "charge:dm01-097",
             "play:dm16-051", "play:dm36-078", "graveyard:dm16-051:",
             "mana:dm02-038", "mana:dm01-042", "mana:dm01-072", "mana:dm01-077", "mana:dm01-075", "mana:dm01-033", "mana:dm01-097",
             "graveyard:dm36-078", "graveyard:dm16-051"]
    policy_avoid: ["charge:dm16-051", "charge:dm36-015", "charge:dm36-078"]
    opp_levels: [0, 1]
    procedure:
      - 毎ターン自分がドリル・スコールで相手マナを墓地へ、ジョバンニがターン終了時に回収、クルトの気合釣りで自分の山札を回復し、相手を山札切れへ（能動ロック）。
  - id: drill_lock_basebuild
    name: ドリル・スコール＋ジョバンニ＋クルト（基盤選びのデッキ）
    split: holdout
    types: [lock]
    win: lock
    lock_mode: active
    core:
      - {id: dm16-051, name: ドリル・スコール, role: ロック}
      - {id: dm36-015, name: 天雷王機ジョバンニX世, role: 回収}
      - {id: dm36-078, name: クルトの気合釣り, role: 山札の回復}
    setup: data/registry/setups/drill_lock_basebuild.json
    # drill_lock と同じ方針を、札の名前に依らない形にしたもの: コンボ以外の札をチャージ → ドリル → クルト（墓地のドリルを山札の上へ）→
    # ドリルで捨てる自分のマナはコンボ以外 → ジョバンニで墓地のクルト・ドリルを手札へ
    policy: ["charge:", "play:dm16-051", "play:dm36-078", "graveyard:dm16-051:", "mana:", "graveyard:dm36-078", "graveyard:dm16-051"]
    policy_avoid: ["charge:dm16-051", "charge:dm36-015", "charge:dm36-078", "mana:dm16-051", "mana:dm36-015", "mana:dm36-078"]
    opp_levels: [0, 1]
    procedure:
      - drill_lock と同じ。デッキは tools/basebuild.py が中核3種を固定して選んだもの（data/decks/basebuild_drill_lock.yaml）。

