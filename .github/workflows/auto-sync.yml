# 公式カードのIDとテキストを定期的に自動取得する。毎回、台帳（cards-data）の続きから進め、新商品も検出する。
# 手動で今すぐ動かす: Actions → auto-sync → Run workflow。止める: tools/auto_sync.yaml の enabled を false。
# 進捗: cards-data ブランチの data/cards/catalog/status.json（実行ごとのジョブサマリにも出る）。
name: auto-sync
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-cards            # sync-cards と同じ枠。同時に2つ動かさない
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore data branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          cp tools/auto_sync.yaml /tmp/auto.yaml
          if git ls-remote --exit-code --heads origin cards-data >/dev/null; then
            git checkout -f cards-data
            git checkout "$GITHUB_SHA" -- tools dmsim .github
          else
            git checkout -B cards-data
          fi
      - name: Run
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import subprocess, yaml
          r = yaml.safe_load(open("/tmp/auto.yaml"))
          if not r.get("enabled", True):
              print("auto_sync.yaml: enabled=false のため何もしない")
          else:
              subprocess.run(["python", "tools/auto_sync.py", "--max-minutes", str(r.get("max_minutes", 300))], check=False)
          PY
      - name: Summary
        if: always()
        run: |
          if [ -f data/cards/catalog/status.json ]; then { echo '```json'; cat data/cards/catalog/status.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit data
        if: always()
        run: |
          git add -f data/cards/catalog
          if [ -d data/cards/raw/by_product ]; then git add -f data/cards/raw/by_product; fi
          git commit -m "cards-data: auto $(date -u +%FT%TZ)" || echo "no changes"
          for i in 1 2 3; do git pull --rebase origin cards-data 2>/dev/null; git push origin HEAD:cards-data && break; sleep 5; done
