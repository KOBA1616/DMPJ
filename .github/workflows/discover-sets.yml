# 公式カード検索ページの HTML（弾の一覧を含む）を取得して cards-raw/_discover ブランチに置く。
name: discover-sets
on:
  push:
    paths: ["tools/discover_request.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/discover_sets.py --out search.html
      - uses: actions/upload-artifact@v4
        with:
          name: search-page
          path: |
            search.html
            _search.js
            _ajax_pop.js
      - name: Push
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout -B cards-raw/_discover
          mkdir -p data/cards/raw; cp search.html data/cards/raw/_search.html
          cp _search.js _ajax_pop.js data/cards/raw/ 2>/dev/null || true
          git add -f data/cards/raw/_search.html data/cards/raw/_search.js data/cards/raw/_ajax_pop.js
          git commit -m "raw: official search page" || exit 0
          git push -f origin cards-raw/_discover
