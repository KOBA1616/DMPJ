# 毎日: 登録デッキ外のコンボ候補を自動で拾い、1人回しで検証し、結果を PR にして自動マージする（tools/combo_hunt.py）。LLM・課金なし。
# 結果は data/combohunt/results.jsonl に追記（測った組は次回飛ばす）。失敗しても既存の定期処理には影響しない。
name: combo-hunt
on:
  schedule:
    - cron: "30 19 * * 1"   # 週1回（月曜）。無料枠対策で毎日から変更
  workflow_dispatch:
    inputs:
      top:
        description: 今回測る候補数
        default: "20"
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/cache@v4
        with:
          path: .cache/combohunt_cycles.json
          key: combohunt-cycles-${{ hashFiles('data/cards/*.yaml') }}
      # 組の選別（combo_screen --pairs）は、開始条件の見直しが済むまで止めている（旧設定は何でも勝つ局面で測っていた）
      - run: PYTHONPATH=. python tools/combo_hunt.py --top "${{ inputs.top || '20' }}" --seeds 6 --turns 4 --workers 2
      - name: "PR にして、tests の成功を確認してからマージ（無料プランでも動く。auto-merge・保護ルールは使わない）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- data/combohunt && exit 0
          b="combohunt/$(date +%Y%m%d-%H%M)"
          git config user.name "combo-hunt"; git config user.email "combo-hunt@users.noreply.github.com"
          git checkout -b "$b"; git add data/combohunt; git commit -m "combo-hunt: 登録外コンボ候補の検証結果を追記"
          git push -u origin "$b"
          pr=$(gh pr create --base main --head "$b" --title "combo-hunt: 検証結果 $(date +%Y-%m-%d)" --body "毎日の自動探索の結果（data/combohunt/results.jsonl）。tests が成功したら自動でマージする。")
          # GITHUB_TOKEN が作った PR は pull_request を起動しないので、tests を手動起動して結果を待つ
          gh workflow run tests.yml --ref "$b"
          sleep 30
          for i in $(seq 1 60); do
            run=$(gh run list --workflow tests.yml --branch "$b" --event workflow_dispatch --limit 1 --json databaseId,status,conclusion -q '.[0]')
            st=$(echo "$run" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read() or "{}"); print(d.get("status",""), d.get("conclusion",""))')
            case "$st" in
              "completed success")
                num="${pr##*/}"
                # API でマージする（ローカルの git を触らない）。失敗したら、原因の文面を Issue に残す（ログが読めなくても直せるように）
                if out=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$num/merge" -f merge_method=squash 2>&1); then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" || true
                  exit 0
                fi
                gh label create tests-failing --color B60205 2>/dev/null || true
                gh issue create --label tests-failing --title "combo-hunt: tests 成功後のマージに失敗" --body "$pr: $out"
                exit 1 ;;
              completed*) gh pr comment "$pr" --body "tests が失敗したのでマージしない（$st）。"; gh label create tests-failing --color B60205 2>/dev/null || true
                          gh issue create --label tests-failing --title "combo-hunt の PR で tests が失敗" --body "$pr の tests が失敗。実行一覧: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/tests.yml"; exit 1 ;;
            esac
            sleep 30
          done
          gh pr comment "$pr" --body "tests の結果を待ちきれなかったのでマージしない。"; exit 1
