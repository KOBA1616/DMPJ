# 自立発見ランナー（tools/auto_discover.py）を手動で回す。LLM・課金なし。結果は artifact に出すだけで、リポジトリには書かない。
# 回したい時: Actions → auto-discover → Run workflow（seconds: 時間予算）。
name: auto-discover
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 時間予算（秒）
        default: "600"
      width:
        description: ビーム幅
        default: "300"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/auto_discover.py --seconds "${{ inputs.seconds }}" --width "${{ inputs.width }}" --out out/loops
      - uses: actions/upload-artifact@v4
        with:
          name: auto-loops
          path: out/loops
