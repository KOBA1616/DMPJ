# 公式カード検索から、弾の一覧→各弾のカードID一覧（台帳）→カード詳細、の順に計画的に取得する。
# tools/sync_request.yaml を編集して push すると動く（workflow_dispatch は main に入るまで使えない）。
# 結果と台帳は cards-data ブランチに積み上げる（途中で止まっても、次の実行が続きから進む）。
name: sync-cards
on:
  push:
    paths: ["tools/sync_request.yaml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-cards
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore data branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          cp tools/sync_request.yaml /tmp/req.yaml
          if git ls-remote --exit-code --heads origin cards-data >/dev/null; then
            git checkout -f cards-data
            git checkout "$GITHUB_SHA" -- tools dmsim .github 2>/dev/null || true
          else
            git checkout -B cards-data
          fi
      - name: Run
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import subprocess, sys, yaml
          r = yaml.safe_load(open("/tmp/req.yaml"))
          mm = str(r.get("max_minutes", 300))
          t = r.get("task")
          prods = r.get("products", "all")
          if t == "list":
              cmd = ["python", "tools/catalog_sets.py", "--list-products"]
          elif t == "catalog":
              cmd = ["python", "tools/catalog_sets.py", "--max-minutes", mm] + (["--all"] if prods == "all" else ["--products", prods])
          elif t == "fetch":
              cmd = ["python", "tools/sync_cards.py", "--max-minutes", mm] + (["--all"] if prods == "all" else ["--products", prods])
          else:
              sys.exit(f"unknown task {t}")
          print(cmd, flush=True)
          subprocess.run(cmd, check=False)
          PY
      - name: Commit data
        if: always()
        run: |
          git add -f data/cards/catalog
          if [ -d data/cards/raw/by_product ]; then git add -f data/cards/raw/by_product; fi
          git commit -m "cards-data: $(date -u +%FT%TZ)" || echo "no changes"
          git push origin HEAD:cards-data
